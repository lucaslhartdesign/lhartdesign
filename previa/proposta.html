<!-- Proposta gerada pelo SniperLeads (16/11/2026). O link traz ?d=<código> com o nome do
     cliente, o tipo do negócio, a cidade, o idioma, a moeda, a validade e as opções (códigos
     dos itens + o preço que o Lucas digitou). Nada é salvo no servidor. Os textos dos itens
     ficam aqui, nos três idiomas: o link só leva os códigos. Sem depoimentos: só o provado. -->
<style>
:root{--bg:#161826;--p:#1c1e2e;--p2:#232532;--ln:#34374a;--gold:#9184d9;--gold2:#d2cefd;--ac:#b5abfc;--gr:#4be39a;--ink:#f1f1f5;--mu:#a3a7ba;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:72px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}
.top{position:sticky;top:0;z-index:30;background:#161826e6;backdrop-filter:blur(10px);border-bottom:1px solid var(--ln)}
.top .wrap{display:flex;align-items:center;gap:16px;height:60px}
.logo{flex:none;text-decoration:none}
.logo img{display:block;height:40px;width:auto}
.priv{margin-left:auto;color:var(--mu);font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:15px 24px;border-radius:99px;background:var(--gr);color:#0d1a13;font-weight:800;font-size:16px;text-decoration:none;border:0;cursor:pointer;box-shadow:0 10px 30px #4be39a40;transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-1px);box-shadow:0 14px 36px #4be39a55}
.btn.g{background:#ffffff0d;color:var(--ink);border:1px solid #ffffff26;box-shadow:none}
.hero{position:relative;overflow:hidden;padding:56px 0 46px;isolation:isolate}
.hero::before{content:"";position:absolute;inset:-30% -10% auto -10%;height:120%;z-index:-1;
  background:radial-gradient(45% 55% at 18% 35%,#9184d955,transparent 70%),radial-gradient(35% 45% at 85% 20%,#4be39a22,transparent 70%)}
.eyebrow{display:inline-flex;align-items:center;gap:8px;padding:7px 15px;border-radius:99px;background:#9184d929;border:1px solid #b5abfc66;color:var(--gold2);font:800 12px Inter;letter-spacing:.09em;text-transform:uppercase}
.eyebrow i{width:8px;height:8px;border-radius:50%;background:var(--gr);box-shadow:0 0 10px var(--gr);font-style:normal}
h1{font:400 clamp(44px,8vw,88px)/.92 'Bebas Neue',sans-serif;letter-spacing:.01em;margin:20px 0 16px;overflow-wrap:anywhere}
h1 em{font-style:normal;background:linear-gradient(100deg,#d2cefd,#b5abfc 35%,#9184d9 85%);-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{max-width:62ch;color:#d9dbe6;font-size:clamp(17px,2.2vw,19px);line-height:1.6;margin:0 0 10px}
.para{color:var(--mu);font-size:15px}
.sec{padding:56px 0;border-top:1px solid var(--ln)}
.sec.alt{background:linear-gradient(180deg,#1c1e2e,#191b29)}
h2{font:400 clamp(34px,5vw,54px)/1 'Bebas Neue',sans-serif;margin:0 0 10px}
h2 em{font-style:normal;color:var(--ac)}
.s{color:#c3c6d4;font-size:17px;line-height:1.6;max-width:64ch;margin:0 0 26px}
.passos{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:0;padding:0;list-style:none}
.passos li{display:flex;gap:14px;padding:18px;border-radius:18px;background:var(--p2);border:1px solid var(--ln)}
.num{flex:none;display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#e4e0ff,#9184d9);color:#0b0c14;font:900 15px Inter}
.passos span{color:#d6d8e3;font-size:15px;line-height:1.5}
.opcoes{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;align-items:stretch}
.op{position:relative;display:flex;flex-direction:column;padding:26px 22px 22px;border-radius:24px;background:linear-gradient(160deg,#ffffff08,#232532);border:1px solid var(--ln)}
.op.dest{border-color:#b5abfc;box-shadow:0 0 0 1px #b5abfc55,0 24px 60px #9184d933;background:linear-gradient(160deg,#9184d926,#232532 60%)}
.selo{position:absolute;top:-12px;left:22px;padding:5px 12px;border-radius:99px;background:linear-gradient(135deg,#b5abfc,#9184d9);color:#161826;font:800 11px Inter;letter-spacing:.08em;text-transform:uppercase}
.op h3{margin:0 0 4px;font:400 34px/1 'Bebas Neue',sans-serif;letter-spacing:.02em}
.op .resumo{color:var(--mu);font-size:14px;margin:0 0 16px}
.preco{font:800 clamp(30px,5vw,40px)/1 Inter;margin:0 0 4px;letter-spacing:-.02em}
.preco small{font-size:15px;font-weight:600;color:var(--mu);margin-left:4px;letter-spacing:0}
.verba{color:var(--gr);font-size:14px;font-weight:700;margin:0 0 16px}
.op ul{list-style:none;margin:0 0 16px;padding:0;display:grid;gap:10px;flex:1}
.op li{display:flex;gap:10px;font-size:15px;line-height:1.45;color:#e3e4ee}
.op li::before{content:"✓";flex:none;display:grid;place-items:center;width:20px;height:20px;margin-top:1px;border-radius:50%;background:#4be39a26;color:var(--gr);font-size:12px;font-weight:900}
.bonus{margin:0 0 18px;padding:12px 14px;border-radius:14px;background:#9184d91a;border:1px dashed #9184d977;font-size:14px;color:#e3e0ff}
.bonus b{color:var(--gold2)}
.op .btn{width:100%}
.obs{margin-top:22px;padding:16px 18px;border-radius:16px;background:var(--p2);border:1px solid var(--ln);color:#d6d8e3;font-size:15px;line-height:1.55;white-space:pre-line}
.fim{color:var(--mu);font-size:13px;text-align:center;padding:26px 16px 40px;border-top:1px solid var(--ln)}
.cta{text-align:center;padding:34px 18px;border-radius:26px;background:radial-gradient(60% 90% at 50% 0%,#9184d933,transparent),#1c1e2e;border:1px solid #9184d955}
.cta p{color:var(--mu);font-size:17px;margin:12px auto 22px;max-width:52ch;line-height:1.55}
.expirou{min-height:70vh;display:flex;align-items:center}
.app{padding:clamp(20px,4vw,34px);border-radius:26px;background:linear-gradient(160deg,#4be39a14,#1c1e2e 55%);border:1px solid #4be39a44}
.app-bt{display:flex;flex-wrap:wrap;gap:10px}
@media(max-width:560px){.app-bt .btn{flex:1 1 100%}}
@media(max-width:560px){.hero{padding:40px 0 34px}.sec{padding:44px 0}}
</style>
<link rel="icon" href="../assets/favicon.png" type="image/png">
</head><body>
<div class="top"><div class="wrap"><a class="logo" href="https://www.lhartdesign.com" aria-label="Lhart Design"><img src="../assets/logo.png" alt="Lhart Design"></a>

<script>
(function () {
  var WA = '5511989304239';
  var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  var wa = function (t) { return 'https://wa.me/' + WA + '?text=' + encodeURIComponent(t); };

  // Os itens que uma opção pode ter. O link leva só o código. Igual a proposta.py (SniperLeads).
  var ITENS = {
    foto: ['Fotos profissionais do lugar e dos produtos', 'Professional photos of your place and products', 'Fotos profesionales del lugar y los productos'],
    reels: ['Vídeos verticais para Reels e TikTok', 'Vertical videos for Reels and TikTok', 'Videos verticales para Reels y TikTok'],

    instagram: ['Instagram arrumado: identidade visual e perfil completo', 'Instagram set up: visual identity and complete profile', 'Instagram listo: identidad visual y perfil completo'],
    google: ['Perfil do Google (Maps) otimizado', 'Optimized Google Business Profile (Maps)', 'Perfil de Google (Maps) optimizado'],
    trafego: ['Campanha de anúncios pagos (Meta e Google) para quem está perto', 'Paid ad campaign (Meta and Google) for people nearby', 'Campaña de anuncios pagados (Meta y Google) para la gente cercana'],
    destino: ['Anúncios para turistas que estão planejando a viagem ou já chegaram', 'Ads to travelers planning their trip or already at the destination', 'Anuncios para turistas que planean el viaje o ya llegaron'],
    relatorio: ['Relatório mensal simples dos resultados', 'Simple monthly results report', 'Informe mensual simple de resultados'],
    atendimento: ['Atendimento automático no WhatsApp e Instagram, 24 horas', 'Automatic replies on WhatsApp and Instagram, 24/7', 'Atención automática en WhatsApp e Instagram, 24 horas'],
    site: ['Site próprio com reserva ou pedido direto', 'Your own website with direct booking or ordering', 'Sitio propio con reserva o pedido directo'],
    app: ['Cardápio online e delivery próprio, sem comissão por pedido', 'Online menu and your own delivery, no commission per order', 'Menú online y delivery propio, sin comisión por pedido'],
    mesa: ['Pedido na mesa por QR Code e adesivo NFC', 'Table ordering by QR code and NFC sticker', 'Pedido en la mesa por QR y sticker NFC']
  };
  var L = {
    pt: { priv: '🔒 Proposta privada', para: 'Proposta para', prep: 'Preparada para', valida: 'Válida até', lead: 'Montamos as opções abaixo para o momento de vocês. Escolha a que faz mais sentido e me chame no WhatsApp.',
      como: 'Como <em>funciona</em>', passos: ['A gente grava o lugar: fotos, vídeo e drone, com qualidade de cinema.', 'Com esse material, montamos a presença online de vocês.', 'Rodamos anúncios para quem está perto ou planejando a visita.', 'Vocês recebem mais clientes diretos, com um relatório simples por mês.'],
      opcoes: 'As <em>opções</em>', mes: '', verba: 'Inclui {v} de verba de anúncio no 1º mês', bonus: 'Bônus:', quero: 'Quero esta opção', rec: 'Recomendado',
      msg: 'Oi Lucas! Vi a proposta do {n} e quero a opção {o}.', duvida: 'Ficou alguma dúvida?', duvidaT: 'Me chama no WhatsApp que eu explico qualquer item ou ajusto a opção para vocês.', falar: 'Falar com o Lucas', msgD: 'Oi Lucas! Vi a proposta do {n} e tenho uma dúvida.',
      exp: 'Esta proposta <em>expirou</em>', expT: 'Ela vale por um tempo limitado. Me chama que eu atualizo para vocês.', expB: 'Pedir uma nova', expM: 'Oi Lucas! A proposta expirou, pode me mandar uma nova?', fim: 'Proposta privada, preparada só para vocês · Lhart Design', obs: 'Condições',
      appT: 'À parte: o <em>app de pedidos</em> de vocês', appS: 'Além dos planos, fazemos o app de pedidos do restaurante: cardápio online com a marca de vocês, pedido na mesa por QR Code ou adesivo NFC e delivery próprio, sem comissão por pedido. É contratado à parte, conforme o que vocês precisarem.', appB: 'Ver o app com o nome de vocês', appM: 'Oi Lucas! Vi a proposta do {n} e quero saber do app de pedidos.', appQ: 'Quero o app também' },
    en: { priv: '🔒 Private proposal', para: 'Proposal for', prep: 'Prepared for', valida: 'Valid until', lead: "We put together the options below for where you are right now. Pick the one that fits best and message me on WhatsApp.",
      como: 'How it <em>works</em>', passos: ['We film your place: photos, video and drone, cinematic quality.', 'With that footage, we build your online presence.', 'We run ads to people nearby or planning their visit.', 'You get more direct customers, with a simple monthly report.'],
      opcoes: 'Your <em>options</em>', verba: 'Includes {v} ad budget for month 1', bonus: 'Bonus:', quero: 'I want this option', rec: 'Recommended',
      msg: 'Hi Lucas! I saw the proposal for {n} and I want the {o} option.', duvida: 'Any questions?', duvidaT: "Message me on WhatsApp and I'll explain any item or adjust the option for you.", falar: 'Message Lucas', msgD: 'Hi Lucas! I saw the proposal for {n} and I have a question.',
      exp: 'This proposal has <em>expired</em>', expT: "It's valid for a limited time. Message me and I'll update it for you.", expB: 'Ask for a new one', expM: 'Hi Lucas! The proposal expired, could you send me a new one?', fim: 'Private proposal, prepared only for you · Lhart Design', obs: 'Terms',
      appT: 'Add-on: your own <em>ordering app</em>', appS: "Besides the plans, we build your restaurant's own online menu: your brand, in English, Spanish and Portuguese, with table ordering by QR code or NFC sticker. Guests order from their phone and the kitchen gets it right away; they pay as they do today, with no commission per order. It's a separate add-on, sized to what you need.", appB: 'See it with your name on it', appM: 'Hi Lucas! I saw the proposal for {n} and I want to know about the ordering app.', appQ: 'I want the app too' },
    es: { priv: '🔒 Propuesta privada', para: 'Propuesta para', prep: 'Preparada para', valida: 'Válida hasta', lead: 'Armamos las opciones de abajo para el momento de ustedes. Elijan la que tenga más sentido y escríbanme por WhatsApp.',
      como: 'Cómo <em>funciona</em>', passos: ['Grabamos el lugar: fotos, video y dron, con calidad de cine.', 'Con ese material, armamos su presencia online.', 'Hacemos anuncios para la gente cercana o que planea la visita.', 'Ustedes reciben más clientes directos, con un informe simple al mes.'],
      opcoes: 'Las <em>opciones</em>', verba: 'Incluye {v} de presupuesto de anuncios el 1er mes', bonus: 'Bono:', quero: 'Quiero esta opción', rec: 'Recomendado',
      msg: '¡Hola Lucas! Vi la propuesta de {n} y quiero la opción {o}.', duvida: '¿Alguna duda?', duvidaT: 'Escríbanme por WhatsApp y les explico cualquier punto o ajusto la opción.', falar: 'Hablar con Lucas', msgD: '¡Hola Lucas! Vi la propuesta de {n} y tengo una duda.',
      exp: 'Esta propuesta <em>expiró</em>', expT: 'Vale por un tiempo limitado. Escríbanme y la actualizo.', expB: 'Pedir una nueva', expM: '¡Hola Lucas! La propuesta expiró, ¿me puedes enviar una nueva?', fim: 'Propuesta privada, preparada solo para ustedes · Lhart Design', obs: 'Condiciones',
      appT: 'Aparte: la <em>app de pedidos</em> de ustedes', appS: 'Además de los planes, hacemos el menú online propio del restaurante: con su marca, en español, inglés y portugués, y pedido en la mesa por QR o sticker NFC. El cliente pide desde el celular y la cocina lo recibe al momento; paga como hoy, sin comisión por pedido. Se contrata aparte, según lo que necesiten.', appB: 'Ver la app con su nombre', appM: '¡Hola Lucas! Vi la propuesta de {n} y quiero saber de la app de pedidos.', appQ: 'Quiero la app también' }
  };
  var IDX = { pt: 0, en: 1, es: 2 };

  // ?d= é base64url de {n, s, c, l, m, a, o:[{t, i:[códigos], v, g, b}], x, r}.
  function ler() {
    var d = new URLSearchParams(location.search).get('d') || '';
    try {
      var b = d.replace(/-/g, '+').replace(/_/g, '/');
      while (b.length % 4) b += '=';
      var bin = atob(b), bytes = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      var j = JSON.parse(new TextDecoder().decode(bytes));
      if (!j.n || !j.o || !j.o.length) return null;
      return j;
    } catch (e) { return null; }
  }

  var c = ler(), main = document.getElementById('conteudo');
  var lang = c && L[c.l] ? c.l : 'pt';
  var T = L[lang], ix = IDX[lang];
  document.documentElement.lang = lang === 'pt' ? 'pt-BR' : lang;
  document.getElementById('priv').textContent = T.priv;
  document.getElementById('fim').textContent = T.fim;
  var hoje = new Date(); hoje.setHours(0, 0, 0, 0);
  var limite = c && /^\d{4}-\d{2}-\d{2}$/.test(c.a || '') ? new Date(c.a + 'T23:59:59') : null;

  if (!c || !limite || limite < hoje) {
    main.innerHTML = '<section class="expirou hero"><div class="wrap"><span class="eyebrow"><i></i>Lhart Design</span>' +
      '<h1>' + T.exp + '</h1><p class="lead">' + T.expT + '</p>' +
      '<a class="btn" target="_blank" rel="noopener" href="' + wa(T.expM) + '">' + T.expB + '</a></div></section>';
    return;
  }

  var N = esc(c.n), moeda = esc(c.m || '');
  var dia = limite.toLocaleDateString(lang === 'pt' ? 'pt-BR' : (lang === 'es' ? 'es' : 'en-US'), { day: '2-digit', month: '2-digit', year: 'numeric' });
  document.title = T.para + ' ' + c.n + ' — Lhart Design';
  var onde = [c.s, c.c].filter(Boolean).map(esc).join(' · ');
  var destaque = typeof c.r === 'number' ? c.r : (c.o.length === 3 ? 1 : -1);

  var cards = c.o.map(function (o, k) {
    var itens = (o.i || []).map(function (cod) { return ITENS[cod] ? '<li>' + esc(ITENS[cod][ix]) + '</li>' : ''; }).join('');
    var bonus = o.b && ITENS[o.b] ? '<div class="bonus"><b>' + T.bonus + '</b> ' + esc(ITENS[o.b][ix]) + '</div>' : '';
    var verba = o.g ? '<div class="verba">' + esc(T.verba.replace('{v}', moeda + ' ' + o.g)) + '</div>' : '<div class="verba" aria-hidden="true"></div>';
    var msg = T.msg.replace('{n}', c.n).replace('{o}', o.t);
    return '<article class="op' + (k === destaque ? ' dest' : '') + '">' +
      (k === destaque ? '<span class="selo">' + T.rec + '</span>' : '') +
      '<h3>' + esc(o.t) + '</h3>' +
      '<div class="preco">' + moeda + ' ' + esc(o.v) + (o.p ? '<small>' + esc(o.p) + '</small>' : '') + '</div>' + verba +
      '<ul>' + itens + '</ul>' + bonus +
      '<a class="btn' + (k === destaque ? '' : ' g') + '" target="_blank" rel="noopener" href="' + wa(msg) + '">' + T.quero + '</a></article>';
  }).join('');

  main.innerHTML =
    '<section class="hero"><div class="wrap"><span class="eyebrow"><i></i>' + T.prep + ' ' + N + '</span>' +
    '<h1>' + T.para + ' <em>' + N + '</em></h1>' +
    '<p class="lead">' + T.lead + '</p>' +
    '<div class="para">' + (onde ? onde + ' · ' : '') + T.valida + ' ' + dia + '</div></div></section>' +

    '<section class="sec alt" id="opcoes"><div class="wrap"><h2>' + T.opcoes + '</h2>' +
    '<div class="opcoes" style="margin-top:28px">' + cards + '</div>' +
    (c.x ? '<div class="obs"><b>' + T.obs + ':</b> ' + esc(c.x) + '</div>' : '') +
    '</div></section>' +
    (c.y && /^https:\/\/www\.lhartdesign\.com\//.test(c.y) ?
      '<section class="sec" id="app"><div class="wrap"><div class="app"><span class="eyebrow"><i></i>App</span>' +
      '<h2 style="margin-top:14px">' + T.appT + '</h2><p class="s">' + T.appS + '</p>' +
      '<div class="app-bt"><a class="btn" href="' + esc(c.y) + '" target="_blank" rel="noopener">📱 ' + T.appB + '</a>' +
      '<a class="btn g" target="_blank" rel="noopener" href="' + wa(T.appM.replace('{n}', c.n)) + '">' + T.appQ + '</a></div></div></div></section>' : '') +

    '<section class="sec"><div class="wrap"><h2>' + T.como + '</h2><ul class="passos" style="margin-top:22px">' +
    T.passos.map(function (p, i) { return '<li><span class="num">' + (i + 1) + '</span><span>' + p + '</span></li>'; }).join('') +
    '</ul></div></section>' +

    '<section class="sec alt"><div class="wrap"><div class="cta"><h2>' + T.duvida + '</h2><p>' + T.duvidaT + '</p>' +
    '<a class="btn" target="_blank" rel="noopener" href="' + wa(T.msgD.replace('{n}', c.n)) + '">' + T.falar + '</a></div></div></section>';
})();
</script>
