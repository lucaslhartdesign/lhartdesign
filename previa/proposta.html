      c: [['🎬', 'Un equipo completo cada mes', 'Foto, video, dron, edición y anuncios, hechos por quien lo hace todos los días. Sin contratar ni capacitar a nadie.'],
          ['📲', 'El cliente llega directo a ustedes', 'Quien llega por el anuncio habla directo con ustedes, por WhatsApp o Instagram, sin intermediario quedándose con parte.'],
          ['📊', 'Ustedes ven el resultado', 'Cada mes un informe simple: cuántas personas lo vieron, cuántas escribieron, qué funcionó mejor.']],
      calc: 'En cuánto tiempo <em>se paga</em>', calcS: 'Ponga cuánto gasta un cliente, en promedio, por visita, reserva o paseo. La cuenta muestra cuántos clientes nuevos al mes pagan cada plan.',
      tk: 'Un cliente gasta, en promedio:', cli: 'clientes nuevos al mes', dia: function (n) { var d = n / 30; return d >= 1 ? 'cerca de ' + Math.round(d) + ' por día' : 'menos de 1 por día (1 cada ' + Math.max(1, Math.round(30 / n)) + ' días)'; },
      nota: 'Es una cuenta de facturación, no una promesa: muestra cuántos clientes nuevos cubren el plan. De ahí en adelante, cada cliente nuevo es ganancia.',
      trab: '¿Quiere ver lo que ya hicimos? Fotos, videos y anuncios de trabajos reales.', trabB: 'Ver nuestros trabajos' }
  };

  // "1.100" / "1,500" / "700" -> número
  function numero(v) {
    var t = String(v || '').replace(/[^\d.,]/g, '');
    if (/^\d{1,3}([.,]\d{3})+$/.test(t)) t = t.replace(/[.,]/g, '');
    else t = t.replace(',', '.');
    var n = parseFloat(t);
    return isFinite(n) ? n : 0;
  }

  var c = ler(), main = document.getElementById('conteudo');
  var lang = c && L[c.l] ? c.l : 'pt';
  var T = L[lang], ix = IDX[lang];
  document.documentElement.lang = lang === 'pt' ? 'pt-BR' : lang;
  document.getElementById('priv').textContent = T.priv;
  document.getElementById('fim').textContent = T.fim;
  var hoje = new Date(); hoje.setHours(0, 0, 0, 0);
  var limite = c && /^\d{4}-\d{2}-\d{2}$/.test(c.a || '') ? new Date(c.a + 'T23:59:59') : null;

  if (!c || !limite || limite < hoje) {
    main.innerHTML = '<section class="expirou hero"><div class="wrap"><span class="eyebrow"><i></i>Lhart Design</span>' +
      '<h1>' + T.exp + '</h1><p class="lead">' + T.expT + '</p>' +
      '<a class="btn" target="_blank" rel="noopener" href="' + wa(T.expM) + '">' + T.expB + '</a></div></section>';
    return;
  }

  var N = esc(c.n), moeda = esc(c.m || '');
  var dia = limite.toLocaleDateString(lang === 'pt' ? 'pt-BR' : (lang === 'es' ? 'es' : 'en-US'), { day: '2-digit', month: '2-digit', year: 'numeric' });
  document.title = T.para + ' ' + c.n + ' — Lhart Design';
  var onde = [c.s, c.c].filter(Boolean).map(esc).join(' · ');
  var destaque = typeof c.r === 'number' ? c.r : (c.o.length === 3 ? 1 : -1);

  var VV = V[lang] || V.en;
  var ticket0 = numero(c.k) || 0;
  function valorHTML() {
    var cartoes = VV.c.map(function (x) { return '<div><i>' + x[0] + '</i><h4>' + x[1] + '</h4><p>' + x[2] + '</p></div>'; }).join('');
    var calc = '';
    if (ticket0 > 0) {
      calc = '<div class="calc" id="calc"><h3>' + VV.calc + '</h3><p>' + VV.calcS + '</p>' +
        '<label class="ticket">' + VV.tk + ' <span class="campo">' + moeda + ' <input id="ticket" type="number" min="1" step="1" inputmode="decimal" value="' + ticket0 + '" aria-label="' + VV.tk + '"></span></label>' +
        '<div class="cops">' + c.o.map(function (o, k) {
          return '<div class="cop' + (k === destaque ? ' dest' : '') + '" data-v="' + numero(o.v) + '"><b>' + esc(o.t) + '</b><span class="pv">' + moeda + ' ' + esc(o.v) + esc(o.p || '') + '</span>' +
            '<span class="n"><span class="q">0</span><small>' + VV.cli + '</small></span><div class="dia"></div>' +
            '<div class="barra"><i></i></div><div class="gente" aria-hidden="true"></div></div>';
        }).join('') + '</div><p class="nota">' + VV.nota + '</p></div>';
    }
    var trab = '<div class="trabalhos"><span>' + VV.trab + '</span><a class="btn g" target="_blank" rel="noopener" href="https://www.lhartdesign.com/social.html?lang=' + lang + '#cases">' + VV.trabB + '</a></div>';
    return '<section class="sec" id="vale"><div class="wrap"><h2>' + VV.tit + '</h2><p class="s">' + VV.sub + '</p>' +
      '<div class="vale-cards">' + cartoes + '</div>' + calc + trab + '</div></section>';
  }

  // A calculadora: conta, enche a barra e faz os bonequinhos aparecerem um a um.
  var reduzido = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  function calcular(animar) {
    var box = document.getElementById('calc');
    if (!box) return;
    var t = numero(document.getElementById('ticket').value);
    var cops = [].slice.call(box.querySelectorAll('.cop'));
    var ns = cops.map(function (el) { var v = +el.dataset.v; return t > 0 && v > 0 ? Math.ceil(v / t) : 0; });
    var maior = Math.max.apply(null, ns.concat([1]));
    cops.forEach(function (el, k) {
      var n = ns[k], q = el.querySelector('.q');
      el.querySelector('.dia').textContent = n ? VV.dia(n) : '';
      el.querySelector('.barra i').style.width = (animar === false ? 0 : Math.max(6, n / maior * 100)) + '%';
      var g = el.querySelector('.gente'), mostrar = Math.min(n, 40);
      g.innerHTML = new Array(mostrar + 1).join('<span></span>') + (n > 40 ? '<em>+' + (n - 40) + '</em>' : '');
      var bonecos = [].slice.call(g.querySelectorAll('span'));
      if (reduzido || animar === 'ja') {
        q.textContent = n;
        bonecos.forEach(function (b) { b.classList.add('on'); });
        return;
      }
      if (animar === false) { q.textContent = '0'; return; }
      var ini = performance.now(), dur = 900;
      (function passo(agora) {
        var f = Math.min(1, (agora - ini) / dur);
        q.textContent = Math.round(n * (1 - Math.pow(1 - f, 3)));
        if (f < 1) requestAnimationFrame(passo);
      })(ini);
      bonecos.forEach(function (b, i) { setTimeout(function () { b.classList.add('on'); }, 120 + i * 35); });
    });
  }
  function ligarCalculadora() {
    var box = document.getElementById('calc');
    if (!box) return;
    calcular(false);
    var visto = false;
    var go = function () { if (!visto) { visto = true; calcular(true); } };
    if ('IntersectionObserver' in window) {
      new IntersectionObserver(function (es, ob) { if (es.some(function (e) { return e.isIntersecting; })) { go(); ob.disconnect(); } }, { threshold: .35 }).observe(box);
    } else { go(); }
    document.getElementById('ticket').addEventListener('input', function () { visto = true; calcular('ja'); });
  }

  var cards = c.o.map(function (o, k) {
    var itens = (o.i || []).map(function (cod) { return ITENS[cod] ? '<li>' + esc(ITENS[cod][ix]) + '</li>' : ''; }).join('');
    var bonus = o.b && ITENS[o.b] ? '<div class="bonus"><b>' + T.bonus + '</b> ' + esc(ITENS[o.b][ix]) + '</div>' : '';
    var verba = o.g ? '<div class="verba">' + esc(T.verba.replace('{v}', moeda + ' ' + o.g)) + '</div>' : '<div class="verba" aria-hidden="true"></div>';
    var msg = T.msg.replace('{n}', c.n).replace('{o}', o.t);
    return '<article class="op' + (k === destaque ? ' dest' : '') + '">' +
      (k === destaque ? '<span class="selo">' + T.rec + '</span>' : '') +
      '<h3>' + esc(o.t) + '</h3>' +
      '<div class="preco">' + moeda + ' ' + esc(o.v) + (o.p ? '<small>' + esc(o.p) + '</small>' : '') + '</div>' + verba +
      '<ul>' + itens + '</ul>' + bonus +
      '<a class="btn' + (k === destaque ? '' : ' g') + '" target="_blank" rel="noopener" href="' + wa(msg) + '">' + T.quero + '</a></article>';
  }).join('');

  main.innerHTML =
    '<section class="hero"><div class="wrap"><span class="eyebrow"><i></i>' + T.prep + ' ' + N + '</span>' +
    '<h1>' + T.para + ' <em>' + N + '</em></h1>' +
    '<p class="lead">' + T.lead + '</p>' +
    '<div class="para">' + (onde ? onde + ' · ' : '') + T.valida + ' ' + dia + '</div></div></section>' +

    valorHTML() +
    '<section class="sec alt" id="opcoes"><div class="wrap"><h2>' + T.opcoes + '</h2>' +
    '<div class="opcoes" style="margin-top:28px">' + cards + '</div>' +
    (c.x ? '<div class="obs"><b>' + T.obs + ':</b> ' + esc(c.x) + '</div>' : '') +
    '</div></section>' +
    (c.y && /^https:\/\/www\.lhartdesign\.com\//.test(c.y) ?
      '<section class="sec" id="app"><div class="wrap"><div class="app"><span class="eyebrow"><i></i>App</span>' +
      '<h2 style="margin-top:14px">' + T.appT + '</h2><p class="s">' + T.appS + '</p>' +
      '<div class="app-bt"><a class="btn" href="' + esc(c.y) + '" target="_blank" rel="noopener">📱 ' + T.appB + '</a>' +
      '<a class="btn g" target="_blank" rel="noopener" href="' + wa(T.appM.replace('{n}', c.n)) + '">' + T.appQ + '</a></div></div></div></section>' : '') +

    '<section class="sec"><div class="wrap"><h2>' + T.como + '</h2><ul class="passos" style="margin-top:22px">' +
    T.passos.map(function (p, i) { return '<li><span class="num">' + (i + 1) + '</span><span>' + p + '</span></li>'; }).join('') +
    '</ul></div></section>' +

    '<section class="sec alt"><div class="wrap"><div class="cta"><h2>' + T.duvida + '</h2><p>' + T.duvidaT + '</p>' +
    '<a class="btn" target="_blank" rel="noopener" href="' + wa(T.msgD.replace('{n}', c.n)) + '">' + T.falar + '</a></div></div></section>';
  ligarCalculadora();
})();
</script>
</body></html>
