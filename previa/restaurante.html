<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Seu app de pedidos — Lhart Design</title>
<meta name="description" content="Demonstração do app de pedidos feita para o seu restaurante: pedido na mesa, delivery e entrega, com o nome de vocês.">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Bebas+Neue&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../mesa-anim.css?v=5">
<!-- Página gerada pelo SniperLeads (09/11/2026). O link traz ?d=<código> com o nome do
     estabelecimento, o modelo do cardápio e a validade (7 dias). Nada é salvo no servidor.
     Regras do material do Lhart Delivery: nenhum preço, e nada que o sistema não faz
     (cartão online, chamar garçom, dividir conta, chat, iFood, nota fiscal, impressão). -->
<style>
:root{--bg:#161826;--p:#1c1e2e;--p2:#232532;--ln:#34374a;--gold:#9184d9;--gold2:#d2cefd;--ac:#b5abfc;--gr:#4be39a;--ink:#e9e9ed;--mu:#9397ab;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:72px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
.top{position:sticky;top:0;z-index:20;background:#161826ee;backdrop-filter:blur(8px);border-bottom:1px solid var(--ln)}
.top .wrap{display:flex;align-items:center;gap:16px;height:60px}
.logo{font:400 24px 'Bebas Neue',sans-serif;letter-spacing:.06em;text-decoration:none;flex:none}
.logo b{color:var(--ac);font-weight:400}
.menu{display:flex;gap:4px;margin-left:auto;overflow-x:auto;scrollbar-width:none}
.menu::-webkit-scrollbar{display:none}
.menu a{padding:8px 12px;border-radius:99px;color:var(--mu);font-size:14px;font-weight:600;text-decoration:none;white-space:nowrap}
.menu a:hover,.menu a:focus-visible{color:var(--ink);background:var(--p2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 24px;border-radius:99px;background:var(--gr);color:#0d1a13;font-weight:700;font-size:15px;text-decoration:none;border:0;cursor:pointer}
.btn.g{background:transparent;color:var(--ink);border:1px solid var(--ln)}
.top .btn{padding:9px 16px;font-size:14px;flex:none}
@media(max-width:760px){.menu{display:none}.top .btn{margin-left:auto}}
.hero{padding:56px 0 40px}
.eyebrow{display:inline-block;padding:6px 14px;border-radius:99px;background:#9184d922;border:1px solid #9184d955;color:var(--gold2);font:700 12px Inter;letter-spacing:.08em;text-transform:uppercase}
h1{font:400 clamp(44px,7vw,84px)/.95 'Bebas Neue',sans-serif;letter-spacing:.01em;margin:18px 0 16px;overflow-wrap:anywhere}
h1 em,h2 em{font-style:normal;color:var(--ac)}
.lead{max-width:62ch;color:#c9cbd6;font-size:18px;line-height:1.55;margin:0 0 26px}
.roteiro{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:0 0 18px;padding:0;list-style:none}
.roteiro a{display:flex;gap:14px;align-items:flex-start;height:100%;padding:16px 18px;border:1px solid var(--ln);border-radius:18px;background:var(--p);text-decoration:none}
.roteiro a:hover,.roteiro a:focus-visible{border-color:var(--gold)}
.num{flex:none;display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--gold2);color:#161826;font:800 15px Inter}
.roteiro b{display:block;font-size:16px;margin-bottom:3px}
.roteiro span{color:var(--mu);font-size:14px;line-height:1.45}
.vale{color:var(--mu);font-size:14px}
.sec{padding:60px 0;border-top:1px solid var(--ln)}
.sec.alt{background:var(--p)}
.tit{display:flex;gap:14px;align-items:center;margin:0 0 10px}
.tit .num{width:42px;height:42px;font-size:18px}
h2{font:400 clamp(34px,5vw,54px)/1 'Bebas Neue',sans-serif;margin:0}
.s{color:var(--mu);font-size:16px;line-height:1.55;max-width:66ch;margin:0 0 24px}
.s b{color:var(--ink)}
.mz-scene{margin:0 auto 8px}
.teste{margin-top:40px;padding:22px;border:1px dashed #9184d977;border-radius:22px;background:#9184d90f}
.teste h3{margin:0 0 6px;font-size:20px}
.teste>p{margin:0 0 14px;color:var(--mu);line-height:1.5}
.passo{display:flex;flex-wrap:wrap;gap:8px;margin:0;padding:0;list-style:none;counter-reset:p}
.passo li{counter-increment:p;display:flex;align-items:center;gap:8px;padding:8px 14px 8px 8px;border-radius:99px;background:var(--p2);border:1px solid var(--ln);font-size:14px}
.passo li::before{content:counter(p);display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--gr);color:#0d1a13;font:800 12px Inter}
.frames{display:flex;flex-wrap:wrap;gap:22px;justify-content:center;align-items:flex-start;margin-top:24px}
.fr{display:flex;flex-direction:column;align-items:center;gap:10px;max-width:100%}
.fr iframe{display:block;border:1px solid var(--ln);border-radius:28px;background:#0f1019}
.fr.ph iframe{width:min(360px,calc(100vw - 76px));height:720px}
.fr.tb iframe{width:min(720px,calc(100vw - 76px));height:520px;border-radius:18px}
.cap{color:var(--ink);font-size:14px;font-weight:700}
.cap small{display:block;color:var(--mu);font-weight:500;text-align:center;margin-top:2px}
.ganhos{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.ganhos div{padding:20px;border-radius:18px;background:var(--p2);border:1px solid var(--ln)}
.ganhos i{font-style:normal;font-size:26px}
.ganhos h4{margin:10px 0 6px;font-size:17px}
.ganhos p{margin:0;color:var(--mu);font-size:15px;line-height:1.5}
.faq{display:grid;gap:10px;max-width:820px}
.faq details{border:1px solid var(--ln);border-radius:16px;background:var(--p2)}
.faq summary{cursor:pointer;list-style:none;padding:18px 20px;font-weight:700;font-size:16px;display:flex;justify-content:space-between;gap:12px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:'+';color:var(--ac);font-size:22px;line-height:1}
.faq details[open] summary::after{content:'−'}
.faq p{margin:0;padding:0 20px 18px;color:#c9cbd6;line-height:1.55}
.comecar{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:0 0 30px;padding:0;list-style:none}
.comecar li{display:flex;gap:14px;padding:18px;border-radius:18px;background:var(--p2);border:1px solid var(--ln)}
.comecar b{display:block;margin-bottom:4px}
.comecar span{color:var(--mu);font-size:15px;line-height:1.45}
.cta{text-align:center;padding:10px 0 0}
.cta p{color:var(--mu);font-size:17px;margin:0 auto 22px;max-width:52ch;line-height:1.55}
.fim{color:var(--mu);font-size:13px;text-align:center;padding:26px 16px 40px;border-top:1px solid var(--ln)}
.expirou{min-height:70vh;display:flex;align-items:center}
.expirou h1{font-size:clamp(40px,6vw,64px)}
</style>
</head><body>
<div class="top"><div class="wrap"><a class="logo" href="#inicio">LHART <b>DESIGN</b></a>
<nav class="menu" id="menu" aria-label="Partes da página"></nav>
<a class="btn wa" href="#">Falar com o Lucas</a></div></div>
<main id="conteudo"></main>
<div class="fim">Demonstração com pedidos de mentira e cardápio de exemplo · nada é cobrado · Lhart Design</div>

<script>
(function () {
  var WA = '5511989304239';
  var MODELOS = ['burger-neon', 'forno-a-lenha', 'acai-tropical', 'marmita-caseira', 'sushi-zen', 'sabor-express'];
  var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  var wa = function (t) { return 'https://wa.me/' + WA + '?text=' + encodeURIComponent(t); };

  // ?d= é base64url de {"n": nome, "m": modelo, "a": "AAAA-MM-DD"}.
  function ler() {
    var d = new URLSearchParams(location.search).get('d') || '';
    try {
      var b = d.replace(/-/g, '+').replace(/_/g, '/');
      while (b.length % 4) b += '=';
      var bin = atob(b), bytes = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      var j = JSON.parse(new TextDecoder().decode(bytes));
      var nome = String(j.n || '').replace(/\s+/g, ' ').trim().slice(0, 40);
      if (!nome) return null;
      return { nome: nome, modelo: MODELOS.indexOf(j.m) >= 0 ? j.m : 'burger-neon', ate: String(j.a || '') };
    } catch (e) { return null; }
  }

  var c = ler(), main = document.getElementById('conteudo');
  var hoje = new Date(); hoje.setHours(0, 0, 0, 0);
  var limite = c && /^\d{4}-\d{2}-\d{2}$/.test(c.ate) ? new Date(c.ate + 'T23:59:59') : null;
  var vencida = !c || !limite || limite < hoje;

  function ligarWhats(texto) {
    document.querySelectorAll('.wa').forEach(function (a) {
      a.href = wa(texto); a.target = '_blank'; a.rel = 'noopener';
    });
  }

  if (vencida) {
    document.title = 'Demonstração expirada — Lhart Design';
    main.innerHTML = '<section class="expirou" id="inicio"><div class="wrap"><span class="eyebrow">Demonstração</span>' +
      '<h1>Esta demonstração <em>expirou</em></h1><p class="lead">Ela fica no ar por 7 dias. Me chama que eu monto outra com o nome de vocês na hora.</p>' +
      '<a class="btn wa" href="#">Pedir uma nova</a></div></section>';
    ligarWhats('Oi Lucas! Abri o link da demonstração do app, mas ela expirou. Pode me mandar outra?');
    return;
  }

  var N = esc(c.nome), q = encodeURIComponent(c.nome);
  var demo = '../demos/delivery-' + c.modelo + '.html?nome=' + q;
  var dia = limite.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' });
  document.title = c.nome + ' · app de pedidos — Lhart Design';
  window.LH_NOME = c.nome;

  var PARTES = [['mesa', 'Pedido na mesa'], ['delivery', 'Delivery'], ['ganhos', 'O que ganham'], ['duvidas', 'Dúvidas'], ['comecar', 'Como começar']];
  document.getElementById('menu').innerHTML = PARTES.map(function (p) { return '<a href="#' + p[0] + '">' + p[1] + '</a>'; }).join('');

  var faq = [
    ['O cliente precisa baixar aplicativo?', 'Não. O cardápio abre no navegador do celular: pelo QR Code da mesa, encostando o celular no adesivo, ou pelo link que vocês mandam no WhatsApp e no Instagram.'],
    ['Vocês cobram comissão por pedido?', 'Não. Não tem porcentagem sobre as vendas, e o Pix de cada pedido cai direto na conta do ' + N + '.'],
    ['Quanto custa?', 'O valor eu passo direto com vocês, depois de ver o cardápio e quantas mesas vocês têm. É só me chamar no WhatsApp.'],
    ['O cardápio fica igual a este?', 'Não. Este é um cardápio de exemplo. O de vocês entra com os pratos, os preços, as fotos e a marca do ' + N + '. Se faltar foto dos pratos, a gente faz.'],
    ['Dá para mudar preço e cardápio depois?', 'Dá. Mudou o preço ou acabou um item, vocês atualizam no painel e vale na hora, na mesa e no delivery.'],
    ['Precisa de motoboy?', 'Para o delivery, sim: o motoboy é de vocês, e pelo app ele recebe a corrida e segue a rota, enquanto o cliente acompanha a entrega. Para o pedido na mesa não precisa de nada disso.'],
    ['E se o cliente for turista?', 'O cardápio abre em português, inglês e espanhol.'],
    ['Esses pedidos aqui são de verdade?', 'Não. Tudo nesta página é demonstração: pode fazer quantos pedidos quiser, nada é cobrado e nada chega na cozinha de vocês.']
  ];

  main.innerHTML =
    // ── Topo: o que é e como ler a página
    '<section class="hero" id="inicio"><div class="wrap"><span class="eyebrow">Feito para ' + N + '</span>' +
    '<h1>O app de pedidos do <em>' + N + '</em></h1>' +
    '<p class="lead">É o cardápio de vocês no celular do cliente. Ele pede sentado na mesa ou de casa, paga pelo Pix, e o pedido chega direto na cozinha. <b style="color:var(--ink)">Sem comissão por pedido.</b> Nesta página você vê e testa tudo, em 3 partes:</p>' +
    '<ul class="roteiro">' +
    '<li><a href="#mesa"><span class="num">1</span><div><b>Pedido na mesa</b><span>O cliente pede pelo celular, sentado, e a cozinha recebe com o número da mesa.</span></div></a></li>' +
    '<li><a href="#delivery"><span class="num">2</span><div><b>Delivery</b><span>Do pedido em casa até o motoboy entregar.</span></div></a></li>' +
    '<li><a href="#comecar"><span class="num">3</span><div><b>Como começar</b><span>O que a gente precisa de vocês para colocar no ar.</span></div></a></li></ul>' +
    '<div class="vale">Demonstração feita para o ' + N + ', no ar até ' + dia + '.</div></div></section>' +

    // ── 1. Mesa
    '<section class="sec alt" id="mesa"><div class="wrap">' +
    '<div class="tit"><span class="num">1</span><h2>Pedido na <em>mesa</em></h2></div>' +
    '<p class="s">Cada mesa tem um QR Code (ou um adesivo de encostar o celular). O cliente abre o cardápio do ' + N + ', escolhe, envia, e o pedido chega na cozinha <b>já com o número da mesa</b>. Sem esperar o garçom e sem erro de anotação. A animação abaixo mostra o caminho inteiro:</p>' +
    '<div class="mz-scene" id="mzscene"></div>' +
    '<div class="teste"><h3>Agora teste você mesmo</h3><p>O celular abaixo está na Mesa 7. Faça um pedido e veja ele aparecer na cozinha ao lado:</p>' +
    '<ol class="passo"><li>Toque num prato e adicione</li><li>“Ver sacola”</li><li>“Fazer pedido”</li><li>“Simular pagamento”</li><li>Olhe a cozinha: chegou a Mesa 7</li></ol>' +
    '<div class="frames"><div class="fr ph"><iframe loading="lazy" title="Celular do cliente na Mesa 7" src="' + demo + '&mesa=7&view=cliente"></iframe><span class="cap">📱 Celular do cliente<small>sentado na Mesa 7</small></span></div>' +
    '<div class="fr tb"><iframe loading="lazy" title="Tela da cozinha" src="' + demo + '&mesa=0&view=cozinha"></iframe><span class="cap">👨‍🍳 Tela da cozinha<small>tablet ou computador · toque em “Preparar” e “Pronto”</small></span></div></div></div>' +
    '</div></section>' +

    // ── 2. Delivery
    '<section class="sec" id="delivery"><div class="wrap">' +
    '<div class="tit"><span class="num">2</span><h2>Delivery <em>até a entrega</em></h2></div>' +
    '<p class="s">O mesmo app faz o delivery. O cliente pede de casa e paga pelo Pix, a cozinha prepara, e o motoboy de vocês recebe a corrida com a rota. <b>O cliente acompanha a entrega no mapa</b>, do preparo até a porta.</p>' +
    '<div class="teste"><h3>Siga um pedido do começo ao fim</h3><p>São as três telas do dia a dia, lado a lado:</p>' +
    '<ol class="passo"><li>No cliente: faça um pedido e “Simular pagamento”</li><li>Na cozinha: “Preparar” e depois “Pronto”</li><li>No motoboy: ative o GPS e aceite a corrida</li><li>“Retirei o pedido” e acompanhe no cliente</li></ol>' +
    '<div class="frames"><div class="fr ph"><iframe loading="lazy" title="App do cliente" src="' + demo + '&view=cliente"></iframe><span class="cap">📱 App do cliente<small>pede e acompanha</small></span></div>' +
    '<div class="fr tb"><iframe loading="lazy" title="Cozinha" src="' + demo + '&view=cozinha"></iframe><span class="cap">👨‍🍳 Cozinha<small>recebe e prepara</small></span></div>' +
    '<div class="fr ph"><iframe loading="lazy" title="App do motoboy" src="' + demo + '&view=motoboy"></iframe><span class="cap">🛵 App do motoboy<small>pega e entrega</small></span></div></div></div>' +
    '</div></section>' +

    // ── O que ganham
    '<section class="sec alt" id="ganhos"><div class="wrap"><h2>O que o ' + N + ' <em>ganha</em></h2><p class="s" style="margin-top:10px">Em resumo, o que muda no dia a dia:</p>' +
    '<div class="ganhos">' +
    '<div><i>💸</i><h4>Sem comissão por pedido</h4><p>Não tem porcentagem sobre cada venda. O Pix cai direto na conta de vocês.</p></div>' +
    '<div><i>⏱</i><h4>Cliente pede na hora</h4><p>Na mesa, ele não espera o garçom passar. Em casa, pede direto com vocês.</p></div>' +
    '<div><i>✅</i><h4>Menos erro de anotação</h4><p>O pedido vai do celular do cliente para a cozinha do jeito que ele escolheu.</p></div>' +
    '<div><i>🧑‍🍳</i><h4>Equipe focada em servir</h4><p>O garçom leva os pratos e atende, em vez de anotar e digitar pedido.</p></div>' +
    '<div><i>📈</i><h4>Pedido maior</h4><p>O cardápio sugere bebida e sobremesa na hora de pedir.</p></div>' +
    '<div><i>🏷</i><h4>A marca é de vocês</h4><p>O cliente vê o nome, o cardápio e as fotos do ' + N + ', não de um aplicativo de terceiros.</p></div>' +
    '</div></div></section>' +

    // ── Dúvidas
    '<section class="sec" id="duvidas"><div class="wrap"><h2>Dúvidas <em>comuns</em></h2><p class="s" style="margin-top:10px">Toque na pergunta para ver a resposta.</p>' +
    '<div class="faq">' + faq.map(function (f, i) { return '<details' + (i === 0 ? ' open' : '') + '><summary>' + f[0] + '</summary><p>' + f[1] + '</p></details>'; }).join('') + '</div>' +
    '</div></section>' +

    // ── 3. Como começar
    '<section class="sec alt" id="comecar"><div class="wrap">' +
    '<div class="tit"><span class="num">3</span><h2>Como <em>começar</em></h2></div>' +
    '<p class="s">É só me mandar estas informações pelo WhatsApp. A gente monta tudo e entrega pronto para usar:</p>' +
    '<ul class="comecar">' +
    '<li><span class="num">1</span><div><b>Cardápio</b><span>Pratos, preços e fotos (se não tiver foto, a gente faz).</span></div></li>' +
    '<li><span class="num">2</span><div><b>Número de mesas</b><span>Para gerar o QR Code de cada uma, pronto para imprimir.</span></div></li>' +
    '<li><span class="num">3</span><div><b>Chave Pix</b><span>Para o dinheiro dos pedidos cair na conta de vocês.</span></div></li>' +
    '<li><span class="num">4</span><div><b>Quem fica na cozinha</b><span>A equipe que vai receber os pedidos no tablet ou no computador.</span></div></li></ul>' +
    '<div class="cta"><h2>Quer o do <em>' + N + '</em> no ar?</h2><p>Me chama no WhatsApp com o cardápio e o número de mesas, e eu te respondo com o prazo e o valor.</p>' +
    '<a class="btn wa" href="#">Chamar o Lucas no WhatsApp</a></div>' +
    '</div></section>';

  ligarWhats('Oi Lucas! Vi o app do ' + c.nome + ' e quero saber mais.');
  // A animação da mesa só sobe depois que o #mzscene existe e o nome está definido.
  var s = document.createElement('script'); s.src = '../mesa-anim.js?v=7'; document.body.appendChild(s);
})();
</script>
</body></html>
