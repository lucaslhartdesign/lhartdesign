<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#161826">
<title>Seu app de pedidos — Lhart Design</title>
<meta name="description" content="Demonstração do app de pedidos feita para o seu restaurante: pedido na mesa, delivery e entrega, com o nome de vocês.">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Bebas+Neue&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../mesa-anim.css?v=5">
<!-- Página gerada pelo SniperLeads (09/11/2026). O link traz ?d=<código> com o nome do
     estabelecimento, o modelo do cardápio e a validade (7 dias). Nada é salvo no servidor.
     Regras do material do Lhart Delivery: nenhum preço, e nada que o sistema não faz
     (cartão online, chamar garçom, dividir conta, chat, iFood, nota fiscal, impressão).
     Pensada primeiro para o celular: é por ele que o dono abre o link do WhatsApp. -->
<style>
:root{--bg:#161826;--p:#1c1e2e;--p2:#232532;--ln:#34374a;--gold:#9184d9;--gold2:#d2cefd;--ac:#b5abfc;--gr:#4be39a;--ink:#f1f1f5;--mu:#a3a7ba;--brilho:0 0 0 1px #9184d955,0 18px 50px #9184d933;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:72px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font-family:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}

/* ── Topo fixo */
.top{position:sticky;top:0;z-index:30;background:#161826e6;backdrop-filter:blur(10px);border-bottom:1px solid var(--ln)}
.top .wrap{display:flex;align-items:center;gap:16px;height:60px}
.logo{font:400 26px 'Bebas Neue',sans-serif;letter-spacing:.06em;text-decoration:none;flex:none}
.logo img{display:block;height:40px;width:auto}
.menu{display:flex;gap:2px;margin-left:auto}
.menu a{padding:8px 12px;border-radius:99px;color:var(--mu);font-size:14px;font-weight:600;text-decoration:none;white-space:nowrap}
.menu a:hover,.menu a:focus-visible{color:var(--ink);background:var(--p2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:15px 26px;border-radius:99px;background:var(--gr);color:#0d1a13;font-weight:800;font-size:16px;text-decoration:none;border:0;cursor:pointer;box-shadow:0 10px 30px #4be39a40;transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-1px);box-shadow:0 14px 36px #4be39a55}
.btn.g{background:#ffffff0d;color:var(--ink);border:1px solid #ffffff26;box-shadow:none}
.btn.g:hover{background:#ffffff17}
.top .btn{padding:9px 16px;font-size:14px;flex:none;box-shadow:none}
@media(max-width:860px){.menu{display:none}.top .btn{margin-left:auto}}

/* ── Topo da página: mais brilho e destaque */
.hero{position:relative;overflow:hidden;padding:64px 0 54px;isolation:isolate}
.hero::before{content:"";position:absolute;inset:-30% -10% auto -10%;height:120%;z-index:-1;
  background:radial-gradient(45% 55% at 18% 35%,#9184d955,transparent 70%),radial-gradient(35% 45% at 85% 20%,#4be39a22,transparent 70%),radial-gradient(40% 50% at 70% 90%,#b5abfc2b,transparent 70%)}
.hero::after{content:"";position:absolute;inset:0;z-index:-1;opacity:.35;
  background-image:linear-gradient(#ffffff0a 1px,transparent 1px),linear-gradient(90deg,#ffffff0a 1px,transparent 1px);background-size:44px 44px;
  -webkit-mask-image:radial-gradient(70% 70% at 30% 30%,#000,transparent);mask-image:radial-gradient(70% 70% at 30% 30%,#000,transparent)}
.eyebrow{display:inline-flex;align-items:center;gap:8px;padding:7px 15px;border-radius:99px;background:#9184d929;border:1px solid #b5abfc66;color:var(--gold2);font:800 12px Inter;letter-spacing:.09em;text-transform:uppercase;box-shadow:0 0 24px #9184d933}
.eyebrow i{width:8px;height:8px;border-radius:50%;background:var(--gr);box-shadow:0 0 10px var(--gr);font-style:normal}
h1{font:400 clamp(46px,8vw,92px)/.92 'Bebas Neue',sans-serif;letter-spacing:.01em;margin:20px 0 18px;overflow-wrap:anywhere}
h1 em{font-style:normal;background:linear-gradient(100deg,#d2cefd,#b5abfc 35%,#9184d9 85%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 28px #9184d966)}
h2 em{font-style:normal;color:var(--ac)}
.lead{max-width:60ch;color:#d9dbe6;font-size:clamp(17px,2.2vw,19px);line-height:1.6;margin:0 0 22px}
.lead b{color:#fff}
.selos{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 26px;padding:0;list-style:none}
.selos li{display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:99px;background:#ffffff0b;border:1px solid #ffffff1f;font-size:14px;font-weight:600}
.selos li::before{content:"✓";display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--gr);color:#0d1a13;font-size:12px;font-weight:900}
.acoes-hero{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:34px}
.roteiro{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin:0 0 16px;padding:0;list-style:none}
.roteiro a{display:flex;gap:14px;align-items:flex-start;height:100%;padding:18px;border:1px solid #9184d944;border-radius:20px;text-decoration:none;
  background:linear-gradient(160deg,#9184d91f,#1c1e2e 55%);transition:border-color .15s,box-shadow .15s,transform .15s}
.roteiro a:hover,.roteiro a:focus-visible{border-color:#b5abfc;box-shadow:var(--brilho);transform:translateY(-2px)}
.num{flex:none;display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#e4e0ff,#9184d9);color:#161826;font:800 15px Inter;box-shadow:0 0 18px #9184d966}
.roteiro b{display:block;font-size:16px;margin-bottom:4px}
.roteiro span{color:var(--mu);font-size:14px;line-height:1.45}
.vale{color:var(--mu);font-size:14px}

/* ── Seções */
.sec{position:relative;padding:64px 0;border-top:1px solid var(--ln)}
.sec.alt{background:linear-gradient(180deg,#1c1e2e,#191b29)}
.tit{display:flex;gap:14px;align-items:center;margin:0 0 12px}
.tit .num{width:44px;height:44px;font-size:18px}
h2{font:400 clamp(36px,5.4vw,58px)/1 'Bebas Neue',sans-serif;margin:0}
.s{color:#c3c6d4;font-size:17px;line-height:1.6;max-width:64ch;margin:0 0 26px}
.s b{color:#fff}

/* ── A animação da mesa: centralizada, sem sobra do lado */
.cena{max-width:674px;margin:0 auto}
/* A cena por dentro tem no máximo 640px: a moldura acompanha (674 = 640 + bordas), e em tela
   grande o conjunto inteiro é ampliado, para encher a largura sem sobra do lado. */
@media(min-width:1000px) and (min-height:760px){.cena{zoom:1.22}}
.mz-scene{box-shadow:0 30px 80px #0009,0 0 0 1px #9184d944,0 0 90px #9184d926!important}

/* ── O teste: abas, telas e setas */
.teste{margin-top:44px;padding:clamp(14px,3vw,26px);border-radius:26px;background:linear-gradient(160deg,#9184d91a,#1c1e2e 40%);border:1px solid #9184d955;box-shadow:0 30px 80px #0007}
.teste h3{margin:0 0 6px;font:400 clamp(28px,4vw,38px)/1 'Bebas Neue',sans-serif;letter-spacing:.02em}
.teste>p{margin:0 0 16px;color:var(--mu);line-height:1.5;font-size:15px}
.abas{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;padding:5px;border-radius:16px;background:#0f1019;border:1px solid var(--ln);margin:0 0 14px}
.aba{display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:8px 6px;border:0;border-radius:12px;background:transparent;color:var(--mu);font-weight:700;font-size:14px;cursor:pointer;transition:background .2s,color .2s}
.aba .n{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:#ffffff14;font-size:12px;font-weight:800}
.aba.on{background:linear-gradient(135deg,#b5abfc,#9184d9);color:#161826;box-shadow:0 6px 20px #9184d955}
.aba.on .n{background:#16182633}
.aba.feito:not(.on) .n{background:var(--gr);color:#0d1a13}
.abas.juntas .aba{cursor:default}
.moldura{position:relative;width:100%;border-radius:22px;overflow:hidden;background:#0f1019;border:1px solid var(--ln)}
.moldura iframe{display:block;border:0;transform-origin:0 0;background:transparent}
.legenda{display:flex;align-items:center;gap:10px;min-height:52px;margin:12px 0 0;padding:12px 14px;border-radius:14px;background:#0f1019;border:1px solid var(--ln);font-size:15px;line-height:1.4;color:#e3e4ee}
.legenda b.n{flex:none;display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--gr);color:#0d1a13;font-size:13px;font-weight:900}
.navega{display:grid;grid-template-columns:auto 1fr;gap:10px;margin-top:12px}
.navega .ant{min-width:54px;padding:0 16px;border-radius:16px;border:1px solid #ffffff26;background:#ffffff0d;color:var(--ink);font-size:20px;font-weight:800;cursor:pointer}
.navega .prox{display:flex;align-items:center;justify-content:center;gap:10px;min-height:58px;padding:10px 18px;border:0;border-radius:16px;background:linear-gradient(135deg,#b5abfc,#9184d9);color:#161826;font-size:16px;font-weight:800;cursor:pointer;box-shadow:0 12px 30px #9184d955}
.navega .prox .seta{font-size:22px;animation:empurra 1.4s ease-in-out infinite}
@keyframes empurra{0%,100%{transform:translateX(0)}50%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){.navega .prox .seta{animation:none}}
.navega button:disabled{opacity:.35;cursor:default}
.deslize{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:10px;color:var(--mu);font-size:13px}
.auto{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:14px}
.auto .btn{padding:13px 20px;font-size:15px}
.auto small{color:var(--mu);font-size:13px}
.modo-largo .navega,.modo-largo .deslize{display:none}

/* ── O resto */
.ganhos{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.ganhos div{padding:22px;border-radius:20px;background:linear-gradient(160deg,#ffffff08,#232532);border:1px solid var(--ln)}
.ganhos i{font-style:normal;font-size:28px}
.ganhos h4{margin:10px 0 6px;font-size:17px}
.ganhos p{margin:0;color:var(--mu);font-size:15px;line-height:1.5}
.faq{display:grid;gap:10px;max-width:820px}
.faq details{border:1px solid var(--ln);border-radius:16px;background:var(--p2)}
.faq details[open]{border-color:#9184d977}
.faq summary{cursor:pointer;list-style:none;padding:18px 20px;font-weight:700;font-size:16px;display:flex;justify-content:space-between;gap:12px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:'+';color:var(--ac);font-size:22px;line-height:1}
.faq details[open] summary::after{content:'−'}
.faq p{margin:0;padding:0 20px 18px;color:#c9cbd6;line-height:1.55}
.comecar{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:0 0 34px;padding:0;list-style:none}
.comecar li{display:flex;gap:14px;padding:18px;border-radius:18px;background:var(--p2);border:1px solid var(--ln)}
.comecar b{display:block;margin-bottom:4px}
.comecar span{color:var(--mu);font-size:15px;line-height:1.45}
.cta{text-align:center;padding:34px 18px;border-radius:26px;background:radial-gradient(60% 90% at 50% 0%,#9184d933,transparent),#1c1e2e;border:1px solid #9184d955}
.cta p{color:var(--mu);font-size:17px;margin:12px auto 24px;max-width:52ch;line-height:1.55}
.fim{color:var(--mu);font-size:13px;text-align:center;padding:26px 16px 40px;border-top:1px solid var(--ln)}
.expirou{min-height:70vh;display:flex;align-items:center}
.expirou h1{font-size:clamp(40px,6vw,64px)}
@media(max-width:560px){
  .hero{padding:40px 0 38px}
  .acoes-hero .btn{flex:1 1 100%}
  .sec{padding:48px 0}
  .aba{font-size:13px;gap:6px}
  .aba .n{display:none}
}
</style>
<link rel="icon" href="../assets/favicon.png" type="image/png">
</head><body>
<div class="top"><div class="wrap"><a class="logo" href="#inicio" aria-label="Lhart Design"><img src="../assets/logo.png" alt="Lhart Design"></a>
<nav class="menu" id="menu" aria-label="Partes da página"></nav>
<a class="btn wa" href="#">Falar com o Lucas</a></div></div>
<main id="conteudo"></main>
<div class="fim">Demonstração com pedidos de mentira e cardápio de exemplo · nada é cobrado · Lhart Design</div>

<script>
(function () {
  var WA = '5511989304239';
  var MODELOS = ['burger-neon', 'forno-a-lenha', 'acai-tropical', 'marmita-caseira', 'sushi-zen', 'sabor-express'];
  var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  var wa = function (t) { return 'https://wa.me/' + WA + '?text=' + encodeURIComponent(t); };

  // ?d= é base64url de {"n": nome, "m": modelo, "a": "AAAA-MM-DD"}.
  function ler() {
    var d = new URLSearchParams(location.search).get('d') || '';
    try {
      var b = d.replace(/-/g, '+').replace(/_/g, '/');
      while (b.length % 4) b += '=';
      var bin = atob(b), bytes = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      var j = JSON.parse(new TextDecoder().decode(bytes));
      var nome = String(j.n || '').replace(/\s+/g, ' ').trim().slice(0, 40);
      if (!nome) return null;
      return { nome: nome, modelo: MODELOS.indexOf(j.m) >= 0 ? j.m : 'burger-neon', ate: String(j.a || '') };
    } catch (e) { return null; }
  }

  var c = ler(), main = document.getElementById('conteudo');
  var hoje = new Date(); hoje.setHours(0, 0, 0, 0);
  var limite = c && /^\d{4}-\d{2}-\d{2}$/.test(c.ate) ? new Date(c.ate + 'T23:59:59') : null;
  var vencida = !c || !limite || limite < hoje;

  function ligarWhats(texto) {
    document.querySelectorAll('.wa').forEach(function (a) {
      a.href = wa(texto); a.target = '_blank'; a.rel = 'noopener';
    });
  }

  if (vencida) {
    document.title = 'Demonstração expirada — Lhart Design';
    main.innerHTML = '<section class="expirou hero" id="inicio"><div class="wrap"><span class="eyebrow"><i></i>Demonstração</span>' +
      '<h1>Esta demonstração <em>expirou</em></h1><p class="lead">Ela fica no ar por 7 dias. Me chama que eu monto outra com o nome de vocês na hora.</p>' +
      '<a class="btn wa" href="#">Pedir uma nova</a></div></section>';
    ligarWhats('Oi Lucas! Abri o link da demonstração do app, mas ela expirou. Pode me mandar outra?');
    return;
  }

  var N = esc(c.nome), q = encodeURIComponent(c.nome);
  // lang=pt: sem ele a demo abre no idioma do navegador (o sushi saiu em inglês).
  var demo = '../demos/delivery-' + c.modelo + '.html?tema=clean&lang=pt&embed=1&nome=' + q;
  var dia = limite.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' });
  document.title = c.nome + ' · app de pedidos — Lhart Design';
  window.LH_NOME = c.nome;

  var PARTES = [['mesa', 'Pedido na mesa'], ['delivery', 'Delivery'], ['ganhos', 'O que ganham'], ['duvidas', 'Dúvidas'], ['comecar', 'Como começar']];
  document.getElementById('menu').innerHTML = PARTES.map(function (p) { return '<a href="#' + p[0] + '">' + p[1] + '</a>'; }).join('');

  var faq = [
    ['O cliente precisa baixar aplicativo?', 'Não. O cardápio abre no navegador do celular: pelo QR Code da mesa, encostando o celular no adesivo, ou pelo link que vocês mandam no WhatsApp e no Instagram.'],
    ['Vocês cobram comissão por pedido?', 'Não. Não tem porcentagem sobre as vendas, e o Pix de cada pedido cai direto na conta do ' + N + '.'],
    ['Quanto custa?', 'O valor eu passo direto com vocês, depois de ver o cardápio e quantas mesas vocês têm. É só me chamar no WhatsApp.'],
    ['O cardápio fica igual a este?', 'Não. Este é um cardápio de exemplo. O de vocês entra com os pratos, os preços, as fotos e a marca do ' + N + '. Se faltar foto dos pratos, a gente faz.'],
    ['Dá para mudar preço e cardápio depois?', 'Dá. Mudou o preço ou acabou um item, vocês atualizam no painel e vale na hora, na mesa e no delivery.'],
    ['Precisa de motoboy?', 'Para o delivery, sim: o motoboy é de vocês, e pelo app ele recebe a corrida e segue a rota, enquanto o cliente acompanha a entrega. Para o pedido na mesa não precisa de nada disso.'],
    ['E se o cliente for turista?', 'O cardápio abre em português, inglês e espanhol.'],
    ['Esses pedidos aqui são de verdade?', 'Não. Tudo nesta página é demonstração: pode fazer quantos pedidos quiser, nada é cobrado e nada chega na cozinha de vocês.']
  ];

  function blocoTeste(id, titulo, texto) {
    return '<div class="teste" id="' + id + '"><h3>' + titulo + '</h3><p>' + texto + '</p>' +
      '<div class="abas" role="tablist"></div>' +
      '<div class="moldura"><iframe title="Demonstração do app" loading="lazy"></iframe></div>' +
      '<div class="legenda" aria-live="polite"><b class="n">1</b><span></span></div>' +
      '<div class="navega"><button type="button" class="ant" aria-label="Tela anterior">←</button>' +
      '<button type="button" class="prox"><span class="rot"></span><span class="seta" aria-hidden="true">→</span></button></div>' +
      '<div class="deslize">👆 Ou deslize o dedo para o lado em cima da tela</div>' +
      '<div class="auto"><button type="button" class="btn g ver">▶ Ver um pedido completo</button><small>mostra tudo andando sozinho</small></div></div>';
  }

  main.innerHTML =
    '<section class="hero" id="inicio"><div class="wrap"><span class="eyebrow"><i></i>Feito para ' + N + '</span>' +
    '<h1>O app de pedidos do <em>' + N + '</em></h1>' +
    '<p class="lead">O cardápio de vocês no celular do cliente. Ele pede <b>sentado na mesa</b> ou <b>de casa</b>, paga pelo Pix, e o pedido chega direto na cozinha.</p>' +
    '<ul class="selos"><li>Sem comissão por pedido</li><li>Pix cai na conta de vocês</li><li>Cliente não baixa aplicativo</li></ul>' +
    '<div class="acoes-hero"><a class="btn" href="#mesa">▶ Testar o app agora</a><a class="btn g" href="#comecar">Como começar</a></div>' +
    '<ul class="roteiro">' +
    '<li><a href="#mesa"><span class="num">1</span><div><b>Pedido na mesa</b><span>O cliente pede sentado, e a cozinha recebe com o número da mesa.</span></div></a></li>' +
    '<li><a href="#delivery"><span class="num">2</span><div><b>Delivery</b><span>Do pedido em casa até o motoboy entregar.</span></div></a></li>' +
    '<li><a href="#comecar"><span class="num">3</span><div><b>Como começar</b><span>O que a gente precisa de vocês para colocar no ar.</span></div></a></li></ul>' +
    '<div class="vale">Demonstração feita para o ' + N + ', no ar até ' + dia + '.</div></div></section>' +

    '<section class="sec alt" id="mesa"><div class="wrap">' +
    '<div class="tit"><span class="num">1</span><h2>Pedido na <em>mesa</em></h2></div>' +
    '<p class="s">Cada mesa tem um QR Code (ou um adesivo de encostar o celular). O cliente abre o cardápio do ' + N + ', escolhe, envia, e o pedido chega na cozinha <b>já com o número da mesa</b>. Sem esperar o garçom e sem erro de anotação.</p>' +
    '<div class="cena"><div class="mz-scene" id="mzscene"></div></div>' +
    blocoTeste('teste-mesa', 'Agora teste você mesmo', 'Você está sentado na Mesa 7. Faça o pedido no celular e depois passe para a cozinha para ver ele chegar.') +
    '</div></section>' +

    '<section class="sec" id="delivery"><div class="wrap">' +
    '<div class="tit"><span class="num">2</span><h2>Delivery <em>até a entrega</em></h2></div>' +
    '<p class="s">O mesmo app faz o delivery. O cliente pede de casa e paga pelo Pix, a cozinha prepara, e o motoboy de vocês recebe a corrida com a rota. <b>O cliente acompanha a entrega no mapa</b>, do preparo até a porta.</p>' +
    blocoTeste('teste-delivery', 'Siga um pedido do começo ao fim', 'São as três telas do dia a dia: o cliente, a cozinha e o motoboy. Use as setas para passar de uma para a outra.') +
    '</div></section>' +

    '<section class="sec alt" id="ganhos"><div class="wrap"><h2>O que o ' + N + ' <em>ganha</em></h2><p class="s" style="margin-top:12px">Em resumo, o que muda no dia a dia:</p>' +
    '<div class="ganhos">' +
    '<div><i>💸</i><h4>Sem comissão por pedido</h4><p>Não tem porcentagem sobre cada venda. O Pix cai direto na conta de vocês.</p></div>' +
    '<div><i>⏱</i><h4>Cliente pede na hora</h4><p>Na mesa, ele não espera o garçom passar. Em casa, pede direto com vocês.</p></div>' +
    '<div><i>✅</i><h4>Menos erro de anotação</h4><p>O pedido vai do celular do cliente para a cozinha do jeito que ele escolheu.</p></div>' +
    '<div><i>🧑‍🍳</i><h4>Equipe focada em servir</h4><p>O garçom leva os pratos e atende, em vez de anotar e digitar pedido.</p></div>' +
    '<div><i>📈</i><h4>Pedido maior</h4><p>O cardápio sugere bebida e sobremesa na hora de pedir.</p></div>' +
    '<div><i>🏷</i><h4>A marca é de vocês</h4><p>O cliente vê o nome, o cardápio e as fotos do ' + N + ', não de um aplicativo de terceiros.</p></div>' +
    '</div></div></section>' +

    '<section class="sec" id="duvidas"><div class="wrap"><h2>Dúvidas <em>comuns</em></h2><p class="s" style="margin-top:12px">Toque na pergunta para ver a resposta.</p>' +
    '<div class="faq">' + faq.map(function (f, i) { return '<details' + (i === 0 ? ' open' : '') + '><summary>' + f[0] + '</summary><p>' + f[1] + '</p></details>'; }).join('') + '</div>' +
    '</div></section>' +

    '<section class="sec alt" id="comecar"><div class="wrap">' +
    '<div class="tit"><span class="num">3</span><h2>Como <em>começar</em></h2></div>' +
    '<p class="s">É só me mandar estas informações pelo WhatsApp. A gente monta tudo e entrega pronto para usar:</p>' +
    '<ul class="comecar">' +
    '<li><span class="num">1</span><div><b>Cardápio</b><span>Pratos, preços e fotos (se não tiver foto, a gente faz).</span></div></li>' +
    '<li><span class="num">2</span><div><b>Número de mesas</b><span>Para gerar o QR Code de cada uma, pronto para imprimir.</span></div></li>' +
    '<li><span class="num">3</span><div><b>Chave Pix</b><span>Para o dinheiro dos pedidos cair na conta de vocês.</span></div></li>' +
    '<li><span class="num">4</span><div><b>Quem fica na cozinha</b><span>A equipe que vai receber os pedidos no tablet ou no computador.</span></div></li></ul>' +
    '<div class="cta"><h2>Quer o do <em>' + N + '</em> no ar?</h2><p>Me chama no WhatsApp com o cardápio e o número de mesas, e eu te respondo com o prazo e o valor.</p>' +
    '<a class="btn wa" href="#">Chamar o Lucas no WhatsApp</a></div>' +
    '</div></section>';

  ligarWhats('Oi Lucas! Vi o app do ' + c.nome + ' e quero saber mais.');

  // ════ As telas de teste ════
  // Computador (≥ 900px de largura): a demo abre larga, com as telas lado a
  // lado, reduzida para caber. Celular: uma tela por vez, com as abas em cima,
  // as setas embaixo e o deslizar do dedo — a página de fora troca a tela da
  // demo chamando setTab() dentro dela (mesmo site, mesmo origin).
  function montarTeste(raiz, cfg) {
    var abasEl = raiz.querySelector('.abas'), moldura = raiz.querySelector('.moldura'), fr = moldura.querySelector('iframe');
    var leg = raiz.querySelector('.legenda'), legN = leg.querySelector('.n'), legT = leg.querySelector('span');
    var ant = raiz.querySelector('.ant'), prox = raiz.querySelector('.prox'), rot = prox.querySelector('.rot');
    var ver = raiz.querySelector('.ver');
    var atual = 0, largo = null, feitos = {}, rodando = false;
    abasEl.innerHTML = cfg.telas.map(function (t, i) {
      return '<button type="button" class="aba" role="tab" data-i="' + i + '"><span class="n">' + (i + 1) + '</span>' + t[1] + ' ' + t[2] + '</button>';
    }).join('');
    var abas = [].slice.call(abasEl.querySelectorAll('.aba'));
    fr.src = cfg.src;

    function win() { try { return fr.contentWindow; } catch (e) { return null; } }
    function doc() { try { return fr.contentDocument; } catch (e) { return null; } }
    function texto(n, t) { legN.textContent = n; legT.textContent = t; }

    function desenhar() {
      abas.forEach(function (a, i) {
        a.classList.toggle('on', largo || i === atual);
        a.classList.toggle('feito', !!feitos[i]);
        a.setAttribute('aria-selected', String(largo || i === atual));
      });
      if (largo) {
        if (!rodando) texto('✓', cfg.juntas);
      } else if (!rodando) {
        texto(atual + 1, cfg.telas[atual][3]);
      }
      ant.disabled = atual === 0;
      var ult = atual === cfg.telas.length - 1;
      rot.textContent = ult ? 'Voltar para o ' + cfg.telas[0][2].toLowerCase() : 'Próximo: ' + cfg.telas[atual + 1][2];
    }

    function ir(i, deFora) {
      var n = cfg.telas.length;
      atual = (i + n) % n;
      if (!largo) { var w = win(); if (w && w.setTab) { try { w.setTab(cfg.telas[atual][0]); } catch (e) {} } }
      if (!deFora) feitos[atual] = true;
      desenhar();
    }

    // Tamanho: no largo a demo renderiza com largura fixa e é reduzida.
    function ajustar() {
      var W = moldura.clientWidth, eraLargo = largo;
      largo = W >= 900;
      raiz.classList.toggle('modo-largo', largo);
      abasEl.classList.toggle('juntas', largo);
      if (largo) {
        var s = Math.min(1, W / cfg.largura);
        fr.style.width = cfg.largura + 'px'; fr.style.height = cfg.altura + 'px';
        fr.style.transform = 'scale(' + s + ')';
        moldura.style.height = Math.ceil(cfg.altura * s) + 'px';
      } else {
        fr.style.width = W + 'px'; fr.style.height = cfg.alturaCel + 'px';
        fr.style.transform = 'none';
        moldura.style.height = cfg.alturaCel + 'px';
      }
      if (eraLargo !== largo) { ir(atual, true); }
      desenhar();
    }

    // A demo troca de tela sozinha no "pedido completo": as abas de fora acompanham.
    setInterval(function () {
      var d = doc(); if (!d) return;
      // Durante o "pedido completo" do delivery, a legenda daqui repete a da demo.
      var cap = d.getElementById('da-cap');
      if (rodando && cap && !cap.hidden && cap.querySelector('b')) {
        texto(cap.querySelector('b').textContent, (cap.querySelector('span') || cap).textContent);
      }
      if (largo) return;
      var on = d.querySelector('.col.on'); if (!on) return;
      var t = on.id.replace('col-', ''), i = -1;
      cfg.telas.forEach(function (x, k) { if (x[0] === t) i = k; });
      if (i >= 0 && i !== atual) { atual = i; desenhar(); }
    }, 400);

    // Deslizar o dedo para o lado em cima da demo troca a tela.
    fr.addEventListener('load', function () {
      ajustar(); ir(atual, true);
      var d = doc(); if (!d) return;
      var x0 = 0, y0 = 0, alvo = null;
      d.addEventListener('touchstart', function (e) { var t = e.touches[0]; x0 = t.clientX; y0 = t.clientY; alvo = e.target; }, { passive: true });
      d.addEventListener('touchend', function (e) {
        if (largo || rodando) return;
        var t = e.changedTouches[0], dx = t.clientX - x0, dy = t.clientY - y0;
        if (Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 1.6) return;
        for (var el = alvo; el && el !== d.body; el = el.parentElement) {
          if (el.scrollWidth > el.clientWidth + 8 && /auto|scroll/.test(getComputedStyle(el).overflowX)) return;
        }
        ir(atual + (dx < 0 ? 1 : -1));
      }, { passive: true });
    });

    abas.forEach(function (a, i) { a.addEventListener('click', function () { if (!largo) ir(i); }); });
    ant.addEventListener('click', function () { ir(atual - 1); });
    prox.addEventListener('click', function () { ir(atual + 1); });
    ver.addEventListener('click', function () { cfg.rodar({ win: win, doc: doc, ir: ir, texto: texto, largo: function () { return largo; },
      inicio: function () { rodando = true; ver.disabled = true; ver.textContent = '… Rodando'; },
      fim: function () { rodando = false; ver.disabled = false; ver.textContent = '↺ Ver de novo'; desenhar(); } }); });

    addEventListener('resize', ajustar);
    ajustar();
  }

  // Delivery: o "pedido completo" é o da própria demo (demo-auto.js), que já
  // troca as telas e escreve a legenda dentro dela.
  function rodarDelivery(api) {
    var d = api.doc(), b = d && d.getElementById('da-btn');
    if (!b) return;
    api.inicio();
    if (!api.largo()) api.ir(0, true);
    b.click();
    api.texto('▶', 'Acompanhe a legenda em cima da tela: o pedido vai do cliente para a cozinha e para o motoboy.');
    setTimeout(api.fim, 36000);
  }

  // Mesa: o "pedido completo" do salão, sem motoboy, tocado daqui de fora.
  function rodarMesa(api) {
    var w = api.win(), d = api.doc();
    if (!w || !d) return;
    var passos = [], t = 0;
    function em(ms, f) { t += ms; passos.push(setTimeout(f, t)); }
    function clica(sel) { var e = d.querySelector(sel); if (e) e.click(); return !!e; }
    function daMesa() { return [].slice.call(d.querySelectorAll('#cozinha .ko')).filter(function (k) { return /Mesa 7/.test(k.innerText); })[0]; }
    api.inicio();
    try {
      w.eval("S=seed();S.orders.forEach(function(o,i){o.cust='Mesa '+(i+2);o.addr='No salão';o.fee=0});S.mesaPronto=1;" +
             "save();L.my=null;L.screen='menu';L.cart={};L.seen=null;localStorage.removeItem(KEY+'-my');renderAll()");
    } catch (e) {}
    em(300, function () { api.ir(0, true); api.texto(1, 'Na Mesa 7, o cliente escolhe o prato no celular.'); });
    em(1400, function () { clica('#cliente [data-a="add"] .ad') || clica('#cliente .it[data-a="add"]'); });
    em(1200, function () { clica('#cliente [data-a="cart"]'); api.texto(2, 'Ele envia o pedido e paga pelo Pix, sem chamar ninguém.'); });
    em(1600, function () { clica('#cliente [data-a="order"]'); });
    em(2000, function () { clica('#cliente [data-a="paynow"]'); });
    em(1400, function () { api.ir(1, true); api.texto(3, 'A cozinha recebe na hora, com o número da mesa.'); });
    em(2200, function () { var k = daMesa(); if (k) { var b = k.querySelector('[data-a="k"]'); if (b) b.click(); } api.texto(4, 'Ela prepara…'); });
    em(2200, function () { var k = daMesa(); if (k) { var b = k.querySelector('[data-a="k"]'); if (b) b.click(); } api.texto(5, '…e marca como pronto.'); });
    em(1800, function () { api.ir(0, true); api.texto(6, 'No celular do cliente: o garçom já leva na mesa.'); });
    em(4000, api.fim);
  }

  montarTeste(document.getElementById('teste-mesa'), {
    src: demo + '&mesa=7', largura: 1240, altura: 860, alturaCel: 700, rodar: rodarMesa,
    juntas: 'O celular da Mesa 7 e a cozinha, lado a lado. Faça um pedido no celular e veja ele chegar na cozinha.',
    telas: [['cliente', '📱', 'Celular', 'Toque num prato, depois em “Ver sacola”, “Fazer pedido” e “Simular pagamento”.'],
            ['cozinha', '👨‍🍳', 'Cozinha', 'Chegou a Mesa 7! Toque em “Preparar” e depois em “Pronto”. Depois volte ao celular.']]
  });
  montarTeste(document.getElementById('teste-delivery'), {
    src: demo, largura: 1440, altura: 860, alturaCel: 700, rodar: rodarDelivery,
    juntas: 'As três telas do dia a dia, lado a lado: faça um pedido no cliente e acompanhe na cozinha e no motoboy.',
    telas: [['cliente', '📱', 'Cliente', 'Faça um pedido: toque num prato, “Ver sacola”, “Fazer pedido” e “Simular pagamento”.'],
            ['cozinha', '👨‍🍳', 'Cozinha', 'O pedido chegou pago. Toque em “Preparar” e depois em “Pronto”.'],
            ['motoboy', '🛵', 'Motoboy', 'Ative o GPS, aceite a corrida e toque em “Retirei o pedido”. O cliente vê no mapa.']]
  });

  // A animação da mesa só sobe depois que o #mzscene existe e o nome está definido.
  var s = document.createElement('script'); s.src = '../mesa-anim.js?v=7'; document.body.appendChild(s);
})();
</script>
</body></html>
