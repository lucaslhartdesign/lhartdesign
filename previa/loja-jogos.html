<!-- Página gerada pelo SniperLeads (17/11/2026), irmã de previa/restaurante.html.
     O link traz ?d=<código>: base64url de {"n": nome da loja, "j": jogo, "i": o que vende
     (coins, robux, diamantes...), "e": estilo da demo, "l": pt|en|es, "a": validade AAAA-MM-DD}.

<style>
:root{--bg:#161826;--p:#1c1e2e;--p2:#232532;--ln:#34374a;--gold:#9184d9;--gold2:#d2cefd;--ac:#b5abfc;--gr:#4be39a;--ink:#f1f1f5;--mu:#a3a7ba;--dc:#5865f2;--dcbg:#313338;--dcbg2:#2b2d31;--dcbg3:#1e1f22;--brilho:0 0 0 1px #9184d955,0 18px 50px #9184d933;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth;scroll-padding-top:72px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit}
button{font-family:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}

/* ── Topo */
.top{position:sticky;top:0;z-index:30;background:#161826e6;backdrop-filter:blur(10px);border-bottom:1px solid var(--ln)}
.top .wrap{display:flex;align-items:center;gap:12px;height:60px}
.logo{flex:none}.logo img{display:block;height:40px;width:auto}
.menu{display:flex;gap:2px;margin-left:auto}
.menu a{padding:8px 12px;border-radius:99px;color:var(--mu);font-size:14px;font-weight:600;text-decoration:none;white-space:nowrap}
.menu a:hover,.menu a:focus-visible{color:var(--ink);background:var(--p2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:15px 26px;border-radius:99px;background:var(--gr);color:#0d1a13;font-weight:800;font-size:16px;text-decoration:none;border:0;cursor:pointer;box-shadow:0 10px 30px #4be39a40;transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-1px);box-shadow:0 14px 36px #4be39a55}
.btn.g{background:#ffffff0d;color:var(--ink);border:1px solid #ffffff26;box-shadow:none}
.btn.g:hover{background:#ffffff17}
.top .btn{padding:9px 16px;font-size:14px;flex:none;box-shadow:none}
.lang{flex:none;display:flex;gap:4px}
.lang a{padding:6px 10px;border:1px solid #ffffff33;border-radius:99px;color:var(--mu);font-size:12px;font-weight:800;text-decoration:none}
.lang a.on{color:var(--ink);border-color:#b5abfc;background:#9184d929}
@media(max-width:860px){.menu{display:none}.lang{margin-left:auto}}
@media(max-width:420px){.top .btn{display:none}}

/* ── Topo da página */
.hero{position:relative;overflow:hidden;padding:56px 0 48px;isolation:isolate}
.hero::before{content:"";position:absolute;inset:-30% -10% auto -10%;height:120%;z-index:-1;
  background:radial-gradient(45% 55% at 18% 35%,#9184d955,transparent 70%),radial-gradient(35% 45% at 85% 20%,#5865f233,transparent 70%),radial-gradient(40% 50% at 70% 90%,#4be39a22,transparent 70%)}
.hero::after{content:"";position:absolute;inset:0;z-index:-1;opacity:.35;
  background-image:linear-gradient(#ffffff0a 1px,transparent 1px),linear-gradient(90deg,#ffffff0a 1px,transparent 1px);background-size:44px 44px;
  -webkit-mask-image:radial-gradient(70% 70% at 30% 30%,#000,transparent);mask-image:radial-gradient(70% 70% at 30% 30%,#000,transparent)}
.eyebrow{display:inline-flex;align-items:center;gap:8px;padding:7px 15px;border-radius:99px;background:#9184d929;border:1px solid #b5abfc66;color:var(--gold2);font:800 12px Inter;letter-spacing:.09em;text-transform:uppercase}
.eyebrow i{width:8px;height:8px;border-radius:50%;background:var(--gr);box-shadow:0 0 10px var(--gr)}
h1{font:400 clamp(44px,8vw,88px)/.92 'Bebas Neue',sans-serif;margin:18px 0 16px;overflow-wrap:anywhere}
h1 em,h2 em{font-style:normal;background:linear-gradient(100deg,#d2cefd,#b5abfc 35%,#9184d9 85%);-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{max-width:60ch;color:#d9dbe6;font-size:clamp(17px,2.2vw,19px);line-height:1.6;margin:0 0 22px}

.selos{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 26px;padding:0;list-style:none}
.selos li{display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:99px;background:#ffffff0b;border:1px solid #ffffff1f;font-size:14px;font-weight:600}
.selos li::before{content:"✓";display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--gr);color:#0d1a13;font-size:12px;font-weight:900}
.roteiro{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin:0;padding:0;list-style:none}
.roteiro a{display:flex;gap:14px;align-items:flex-start;height:100%;padding:18px;border:1px solid #9184d944;border-radius:20px;text-decoration:none;background:linear-gradient(160deg,#9184d91f,#1c1e2e 55%);transition:border-color .15s,transform .15s}
.roteiro a:hover{border-color:#b5abfc;transform:translateY(-2px)}
.num{flex:none;display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#e4e0ff,#9184d9);color:#0b0c14;font:900 16px Inter}
.roteiro b{display:block;font-size:16px;margin-bottom:4px}
.roteiro span{color:var(--mu);font-size:14px;line-height:1.45}
/* O número da bolinha também é um <span>: sem isto herda o cinza e fica apagado. */
.roteiro .num,.comecar .num,.tit .num{color:#0b0c14;font-weight:900;font-size:16px}
.tit .num{font-size:18px}

/* ── Seções */
.sec{padding:60px 0;border-top:1px solid var(--ln)}
.sec.alt{background:linear-gradient(180deg,#1c1e2e,#191b29)}
.tit{display:flex;gap:14px;align-items:center;margin:0 0 12px}
.tit .num{width:44px;height:44px;font-size:18px}
h2{font:400 clamp(34px,5.4vw,56px)/1 'Bebas Neue',sans-serif;margin:0}
.s{color:#c3c6d4;font-size:17px;line-height:1.6;max-width:64ch;margin:0 0 24px}
.s b{color:#fff}
.duas{display:grid;grid-template-columns:minmax(0,400px) minmax(0,1fr);gap:34px;align-items:center}
.duas.dcx{grid-template-columns:minmax(0,1fr) minmax(0,360px)}
@media(max-width:900px){.duas,.duas.dcx{grid-template-columns:1fr}}
.passos{display:grid;gap:10px;margin:0;padding:0;list-style:none;counter-reset:p}
.passos li{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:16px;background:#ffffff08;border:1px solid var(--ln);color:#d9dbe6;line-height:1.45;font-size:15px;transition:border-color .3s,background .3s}
.passos li::before{counter-increment:p;content:counter(p);flex:none;display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:#ffffff14;font-weight:800;font-size:13px}
.passos li.on{border-color:var(--gr);background:#4be39a12}
.passos li.on::before{background:var(--gr);color:#0d1a13}

.tocar{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.nota{color:var(--mu);font-size:13px;margin-top:12px}

/* ── O celular com a loja */
.cel{position:relative;width:min(100%,360px);margin:0 auto;aspect-ratio:9/18.5;border-radius:42px;padding:12px;background:linear-gradient(160deg,#3a3d52,#14151f);box-shadow:0 40px 90px #000a,0 0 0 1px #ffffff1a,0 0 90px #9184d930}
.tela{position:relative;height:100%;border-radius:32px;overflow:hidden;background:var(--lj-bg,#0d0b18);color:#f3eaff;display:flex;flex-direction:column}
.lj-top{display:flex;align-items:center;gap:10px;padding:16px 16px 12px;border-bottom:1px solid #ffffff14}
.lj-logo{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--lj-a,#ff2bd6),var(--lj-b,#18f0ff));color:#0b0618;font:900 15px Inter;flex:none}
.lj-nome{font:800 15px Inter;line-height:1.1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lj-nome small{display:block;font:600 11px Inter;color:#b9a9df}
.lj-cart{margin-left:auto;position:relative;width:36px;height:36px;border-radius:10px;background:#ffffff12;display:grid;place-items:center;font-size:17px}
.lj-cart b{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;border-radius:9px;background:var(--lj-a,#ff2bd6);color:#fff;font-size:11px;display:grid;place-items:center;transform:scale(0);transition:transform .25s}
.lj-cart b.v{transform:scale(1)}
.lj-corpo{position:relative;flex:1;overflow:hidden}
.lj-v{position:absolute;inset:0;padding:14px;overflow:auto;transition:transform .35s ease,opacity .35s}
.lj-v.fora{transform:translateX(100%);opacity:0;pointer-events:none}
.lj-v.atras{transform:translateX(-30%);opacity:0;pointer-events:none}
.lj-banner{padding:16px;border-radius:16px;background:linear-gradient(135deg,#ffffff14,#ffffff05);border:1px solid #ffffff1a;margin-bottom:12px}
.lj-banner b{display:block;font:400 26px/1 'Bebas Neue';letter-spacing:.03em}
.lj-banner span{font-size:12px;color:#c9bdea}
.lj-grade{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lj-p{padding:12px;border-radius:14px;background:#ffffff0d;border:1px solid #ffffff17;text-align:left;color:inherit;cursor:pointer;transition:transform .15s,border-color .15s}
.lj-p:hover,.lj-p.toque{border-color:var(--lj-b,#18f0ff);transform:translateY(-2px)}
.lj-p i{display:block;font-size:26px;font-style:normal;margin-bottom:6px}
.lj-p b{display:block;font-size:14px}
.lj-p span{display:block;margin-top:4px;font-weight:800;color:var(--lj-b,#18f0ff);font-size:13px}
.lj-linha{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px dashed #ffffff22;font-size:14px}
.lj-bt{display:block;width:100%;margin-top:14px;padding:13px;border:0;border-radius:12px;background:var(--lj-a,#ff2bd6);color:#fff;font-weight:800;font-size:15px;cursor:pointer}
.lj-bt.toque{filter:brightness(1.2);transform:scale(.98)}
.qr{width:150px;height:150px;margin:12px auto;border-radius:12px;background:#fff;padding:10px;display:grid;grid-template-columns:repeat(21,1fr);grid-template-rows:repeat(21,1fr)}
.qr i{background:#111}.qr i.b{background:#fff}
.espera{display:flex;align-items:center;justify-content:center;gap:8px;color:#c9bdea;font-size:13px}
.espera::before{content:"";width:14px;height:14px;border-radius:50%;border:2px solid #ffffff33;border-top-color:var(--lj-b,#18f0ff);animation:gira .8s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
.ok-grande{display:grid;place-items:center;width:84px;height:84px;margin:24px auto 12px;border-radius:50%;background:var(--gr);color:#0d1a13;font-size:44px;font-weight:900;box-shadow:0 0 40px #4be39a88;animation:pula .5s ease}
@keyframes pula{0%{transform:scale(.3)}70%{transform:scale(1.1)}100%{transform:scale(1)}}
.lj-chat{margin-top:14px;padding:12px;border-radius:14px;background:#ffffff0b;font-size:13px;line-height:1.45}
.lj-chat p{margin:0 0 8px}.lj-chat p:last-child{margin:0}
.lj-chat b{color:var(--lj-b,#18f0ff)}
/* 17/11/2026 — a loja de VERDADE do estilo dentro do celular (o Lucas: "não está
   aparecendo no estilo da loja; é bom ele rolar a loja, ver o produto e ir até a compra"). */
.lj-fr{position:absolute;left:0;top:0;width:390px;border:0;transform-origin:0 0;background:var(--lj-bg,#0d0b18)}
.lj-folha{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;background:var(--lj-bg,#0d0b18);transform:translateY(102%);transition:transform .45s cubic-bezier(.2,.8,.2,1);box-shadow:0 -20px 40px #0008}
.lj-folha.on{transform:none}
.lj-fecha{margin-left:auto;width:34px;height:34px;border-radius:10px;border:0;background:#ffffff14;color:#fff;font-size:16px;cursor:pointer}
.lj-dica{position:absolute;left:50%;bottom:16px;z-index:2;transform:translateX(-50%);padding:8px 14px;border-radius:99px;background:#000c;color:#fff;font-size:12px;font-weight:700;white-space:nowrap;pointer-events:none;transition:opacity .3s}
.lj-dica.some{opacity:0}
.toque-dedo{position:absolute;z-index:5;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;background:#ffffffaa;box-shadow:0 0 0 8px #ffffff33;pointer-events:none;opacity:0;transition:left .45s ease,top .45s ease,opacity .2s}

/* ── O Discord */
.dc{border-radius:20px;overflow:hidden;background:var(--dcbg);border:1px solid #ffffff14;box-shadow:0 40px 90px #0009,0 0 80px #5865f22b;display:grid;grid-template-columns:200px minmax(0,1fr);min-height:440px;font-size:14px}

.dc-main{display:flex;flex-direction:column;min-width:0}
.dc-head{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid #0004;font-weight:800;color:#f2f3f5}
.dc-head span{color:#80848e;font-weight:400}
.dc-head .tab{margin-left:auto;display:flex;gap:4px}

.dc-msgs{flex:1;padding:12px 16px 16px;overflow:auto;max-height:430px;display:flex;flex-direction:column;gap:12px}
.dc-m{display:flex;gap:12px;animation:entra .35s ease}
@keyframes entra{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.dc-av{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:14px;color:#fff;background:#4e5058}

.dc-m .quem{font-weight:700;color:#f2f3f5}
.dc-m .quem small{margin-left:6px;padding:1px 5px;border-radius:4px;background:var(--dc);color:#fff;font-size:10px;font-weight:800;vertical-align:1px}
.dc-m .quem time{margin-left:6px;color:#949ba4;font-size:11px;font-weight:400}
.dc-m .txt{color:#dbdee1;line-height:1.45;margin-top:2px;overflow-wrap:anywhere}
.dc-m .txt code{padding:1px 5px;border-radius:4px;background:#1e1f22;color:#c9cdfb;font-size:13px}
.emb{margin-top:6px;max-width:440px;padding:12px 14px;border-radius:6px;background:var(--dcbg2);border-left:4px solid var(--dc);color:#dbdee1;line-height:1.45}
.emb.ok{border-left-color:#23a55a}.emb.aviso{border-left-color:#f0b232}
.emb b{display:block;color:#f2f3f5;margin-bottom:4px}
.emb .campos{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;margin-top:8px;font-size:13px}
.emb .campos span{color:#949ba4;display:block;font-size:11px;font-weight:700;text-transform:uppercase}
.dc-bts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.dc-bts span{padding:7px 14px;border-radius:4px;background:var(--dc);color:#fff;font-weight:600;font-size:13px}
.dc-bts span.cinza{background:#4e5058}.dc-bts span.verde{background:#248046}
.dc-dig{margin:0 16px 14px;padding:11px 14px;border-radius:8px;background:#383a40;color:#80848e}
.dc-dig.escreve{color:#dbdee1}

/* ── Ganhos, exemplos, começar */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.card{padding:20px;border-radius:20px;background:#ffffff08;border:1px solid var(--ln)}
.card i{font-style:normal;font-size:28px}
.card b{display:block;margin:10px 0 6px;font-size:17px}
.card span{color:var(--mu);line-height:1.5;font-size:15px}
.ex{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.ex a{display:block;padding:18px;border-radius:18px;text-decoration:none;border:1px solid #9184d944;background:linear-gradient(160deg,#9184d91f,#1c1e2e 60%);transition:border-color .15s,transform .15s}

.ex a b{display:block;font-size:17px;margin-bottom:4px}
.ex a span{color:var(--mu);font-size:14px;line-height:1.45}
.ex a em{display:inline-block;margin-top:10px;font-style:normal;color:var(--ac);font-weight:700;font-size:14px}

.comecar ol{display:grid;gap:10px;margin:0 0 22px;padding:0;list-style:none}
.comecar li{display:flex;gap:12px;align-items:flex-start;color:#d9dbe6;line-height:1.5}
.fim{padding:30px 16px 40px;text-align:center;color:var(--mu);font-size:13px;border-top:1px solid var(--ln)}
.expirou{padding:90px 0}
</style>

      return x === 0 || x === 6 || y === 0 || y === 6 || (x >= 2 && x <= 4 && y >= 2 && y <= 4);
    }
    for (var y = 0; y < T; y++) for (var x = 0; x < T; x++) {
      var v = fd(x, y); if (v === null) v = fd(T - 1 - x, y); if (v === null) v = fd(x, T - 1 - y);
      if (v === null) v = (x === 7 || y === 7 || x === T - 8 || y === T - 8) && (x < 8 || y < 8 || (x < 8 && y > T - 9)) ? false : ((Math.sin((x * 31 + y * 17) * 12.9898) * 43758.5453) % 1 + 1) % 1 > .5;
      s += '<i' + (v ? '' : ' class="b"') + '></i>';
    }
    qr.innerHTML = s;
  }

  // ── A loja: telas e o "Ver uma compra"
  var telas = [null, 'v2', 'v3', 'v4'].map(function (id) { return id && document.getElementById(id); });
  var folha = document.getElementById('folha'), dica = document.getElementById('dica');
  var pL = document.querySelectorAll('#pL li'), pD = document.querySelectorAll('#pD li');
  // Cada parte (loja, discord) tem os próprios tempos: rodar uma não corta a outra.
  var timers = { loja: [], dc: [] }, grupo = 'loja';
  function limpar() { timers[grupo].forEach(clearTimeout); timers[grupo] = []; if (grupo === 'loja') rolando = null; }
  function em(ms, f) { timers[grupo].push(setTimeout(f, ms)); }
  // 0 = a loja (a folha da compra fechada); 1 carrinho; 2 pagamento; 3 confirmado.
  function tela(k) {
    folha.classList.toggle('on', k > 0);
    telas.forEach(function (t, i) { if (t) t.className = 'lj-v' + (i < k ? ' atras' : (i > k ? ' fora' : '')); });
  }
  function passo(lista, k) { lista.forEach(function (li, i) { li.classList.toggle('on', i === k); }); }
  var dedo = document.getElementById('dedo'), cel = document.getElementById('cel');
  function tocar(el, noFrame) {
    if (!el) return;
    var base = cel.querySelector('.tela').getBoundingClientRect(), r = el.getBoundingClientRect(), x, y;
    if (noFrame) {
      var f = fr.getBoundingClientRect();
      x = f.left - base.left + (r.left + r.width / 2) * ESC; y = f.top - base.top + (r.top + r.height / 2) * ESC;
    } else { x = r.left - base.left + r.width / 2; y = r.top - base.top + r.height / 2; }
    dedo.style.left = x + 'px'; dedo.style.top = y + 'px'; dedo.style.opacity = 1;
    el.classList.add('toque'); setTimeout(function () { el.classList.remove('toque'); dedo.style.opacity = 0; }, 550);
  }

  // ── A loja de verdade, no estilo escolhido, com o nome da loja.
  var fr = document.getElementById('lojaFr'), ESC = 1, pronta = false, pendente = false, rolando = null;
  function ajustarFr() {
    var t = cel.querySelector('.tela');
    ESC = t.clientWidth / 390;
    fr.style.transform = 'scale(' + ESC + ')';
    fr.style.height = Math.ceil(t.clientHeight / ESC) + 'px';
  }
  function win() { try { return fr.contentWindow; } catch (e) { return null; } }
  function doc() { try { return fr.contentDocument; } catch (e) { return null; } }
  var RX_PRECO = /(R\$|US\$|\$|€)\s?\d[\d.,]*/;
  var RX_COMPRA = /comprar|adicionar|add to|buy|carrinho|detalhes|finalizar|ver oferta|pegar/i;
  function trocarNome(d) {
    // O logo: o 1º texto com letra vira o nome; o resto do logo some (ex.: NEON<b>ARENA</b>).
    var logo = d.querySelector('.logo') || d.querySelector('header a');
    if (logo) {
      var w = d.createTreeWalker(logo, NodeFilter.SHOW_TEXT), n, primeiro = true;
      while ((n = w.nextNode())) {
        if (!/\p{L}/u.test(n.nodeValue)) continue;
        if (primeiro) { n.nodeValue = c.nome; primeiro = false; } else n.nodeValue = '';
      }
    }
    // O nome do estilo no resto da página (rodapé, títulos) vira o da loja.
    var rx = new RegExp(EST[0].replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
    var w2 = d.createTreeWalker(d.body, NodeFilter.SHOW_TEXT), m;
    while ((m = w2.nextNode())) { rx.lastIndex = 0; if (rx.test(m.nodeValue)) { rx.lastIndex = 0; m.nodeValue = m.nodeValue.replace(rx, c.nome); } }
    d.title = c.nome;
  }
  function visivel(el) { var r = el.getBoundingClientRect(); return r.width > 20 && r.height > 14; }
  function produtos(d) {
    var bts = [].slice.call(d.querySelectorAll('button, a')).filter(function (el) {
      return RX_COMPRA.test(el.textContent) && !el.closest('header, nav') && visivel(el);
    });
    if (bts.length) return bts;
    // Loja sem botão de compra (só cards): o card que mostra um preço.
    return [].slice.call(d.querySelectorAll('article, li, a, div')).filter(function (el) {
      var r = el.getBoundingClientRect();
      return r.height > 70 && r.height < 420 && r.width < 380 && RX_PRECO.test(el.textContent) && !el.closest('header, nav');
    }).slice(0, 8);
  }
  var RX_NAO_NOME = /estoque|stock|comprar|adicionar|detalhes|carrinho|add|buy|%|avalia|entrega|^\W*$/i;
  function infoDo(el) {
    var card = el, k = 0;
    while (card && k < 6 && !(RX_PRECO.test(card.textContent) && card.getBoundingClientRect().height > 60)) { card = card.parentElement; k++; }
    var reserva = { nome: ESCOLHA[1], preco: preco(ESCOLHA[2]) };
    if (!card || card.getBoundingClientRect().height > 600) return reserva;
    // O nome: o título do card, ou o 1º texto curto que não é preço, estoque nem botão.
    var nome = '', h = card.querySelector('h1, h2, h3, h4, h5');
    if (h) nome = h.textContent.replace(/\s+/g, ' ').trim();
    if (!nome) {
      var folhas = [].slice.call(card.querySelectorAll('*')).filter(function (x) { return !x.children.length; });
      for (var i = 0; i < folhas.length && !nome; i++) {
        var t = folhas[i].textContent.replace(/\s+/g, ' ').trim();
        if (t.length >= 3 && t.length <= 40 && /\p{L}{3}/u.test(t) && !RX_PRECO.test(t) && !RX_NAO_NOME.test(t)) nome = t;
      }
    }
    var pr = (card.textContent.match(RX_PRECO) || [])[0];
    // Sem o nome do produto, vai o exemplo inteiro (nome e preço juntos, nunca misturados).
    if (!nome || !pr) return reserva;
    return { nome: nome.slice(0, 32), preco: pr };
  }
  function prepararLoja() {
    var d = doc();
    if (!d || !d.body) return;
    try { trocarNome(d); } catch (e) {}
    // A loja de exemplo tem rolagem "suave" propria, que brigava com a animacao.
    d.documentElement.style.scrollBehavior = 'auto';
    // Toque num produto na loja → abre a compra aqui (a loja de exemplo não vende de verdade).
    d.addEventListener('click', function (e) {
      var a = e.target.closest('a[href]');
      var alvo = e.target.closest('button, a, article, li, div');
      var txt = alvo ? (alvo.textContent || '') : '';
      var ehCompra = alvo && !alvo.closest('header, nav') && (RX_COMPRA.test(txt) || (RX_PRECO.test(txt) && alvo.getBoundingClientRect().height < 420));
      if (ehCompra) { e.preventDefault(); e.stopPropagation(); grupo = 'loja'; limpar(); abrirCompra(infoDo(alvo)); return; }
      if (a && !/^#/.test(a.getAttribute('href') || '')) e.preventDefault();   // nada de sair da demo
    }, true);
    win().addEventListener('scroll', function () { if (!rolando) dica.classList.add('some'); }, { passive: true });
    pronta = true;
    if (pendente) { pendente = false; rodarLoja(); }
  }
  function rolar(w, ate, ms) {
    // Relogio comum (e nao requestAnimationFrame): anda mesmo com a aba sem foco.
    var de = w.scrollY, t0 = Date.now(), meu = {};
    rolando = meu;
    var id = setInterval(function () {
      if (rolando !== meu) { clearInterval(id); return; }
      var p = Math.min(1, (Date.now() - t0) / ms), e = p < .5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
      w.scrollTo(0, de + (ate - de) * e);
      if (p >= 1) { clearInterval(id); rolando = null; }
    }, 16);
  }
  function abrirCompra(info) {
    document.getElementById('cItem').textContent = info.nome;
    document.getElementById('cPreco').textContent = info.preco;
    document.getElementById('entregue').style.opacity = 0;
    dica.classList.add('some');
    tela(1); passo(pL, 0);
  }
  function pagar() {
    grupo = 'loja';
    tela(2); passo(pL, 1);
    em(2600, function () { tela(3); passo(pL, 2); });
    em(4400, function () { document.getElementById('entregue').style.opacity = 1; passo(pL, pL.length - 1); });
  }
  document.getElementById('btPagar').addEventListener('click', function () { grupo = 'loja'; limpar(); pagar(); });
  document.getElementById('fechaFolha').addEventListener('click', function () { grupo = 'loja'; limpar(); tela(0); passo(pL, -1); });
  function rodarLoja() {
    grupo = 'loja'; limpar(); tela(0); passo(pL, -1);
    if (!pronta) { pendente = true; return; }
    var w = win(), d = doc(); if (!w || !d) return;
    w.scrollTo(0, 0);
    // O 1º produto que aparece INTEIRO na largura (carrossel deixa os outros fora da tela).
    var lista = produtos(d), alvo = lista.filter(function (el) { var r = el.getBoundingClientRect(); return r.left >= 0 && r.right <= w.innerWidth; })[0] || lista[0];
    var ate = alvo ? Math.max(0, alvo.getBoundingClientRect().top + w.scrollY - w.innerHeight * .45) : w.innerHeight;
    em(500, function () { rolar(w, ate * .45, 1300); });
    em(2100, function () { rolar(w, ate, 1300); });
    em(3700, function () { if (alvo) tocar(alvo, true); });
    em(4250, function () { abrirCompra(alvo ? infoDo(alvo) : { nome: ESCOLHA[1], preco: preco(ESCOLHA[2]) }); });
    em(5700, function () { tocar(document.getElementById('btPagar')); });
    em(6200, function () { pagar(); });
  }
  ajustarFr();
  addEventListener('resize', ajustarFr);
  fr.addEventListener('load', prepararLoja);
  fr.src = '../demos/' + c.estilo + '.html';
  document.getElementById('verLoja').addEventListener('click', rodarLoja);

  // ── O Discord
  var dcLoja = document.getElementById('dcLoja'), dcEq = document.getElementById('dcEq'), dig = document.getElementById('dcDig');
  var hora = function () { var d = new Date(); return tr('Hoje às ', 'Today at ', 'Hoy a las ') + d.getHours() + ':' + String(d.getMinutes()).padStart(2, '0'); };
  function msg(onde, bot, quem, html) {
    var m = document.createElement('div'); m.className = 'dc-m';
    m.innerHTML = '<span class="dc-av' + (bot ? ' bot' : '') + '">' + (bot ? esc(sigla) : 'J') + '</span><div style="min-width:0"><div class="quem">' + quem + (bot ? '<small>BOT</small>' : '') + '<time>' + hora() + '</time></div><div class="txt">' + html + '</div></div>';
    onde.appendChild(m); onde.scrollTop = onde.scrollHeight;
  }
  function verCanal(qual) {
    var eq = qual === 'eq';
    dcLoja.hidden = eq; dcEq.hidden = !eq;
    document.getElementById('dcCanal').textContent = eq ? tr('vendas', 'sales', 'ventas') : tr('comprar', 'buy', 'comprar');
    document.getElementById('canLoja').classList.toggle('on', !eq); document.getElementById('canEq').classList.toggle('on', eq);
    if (eq) document.getElementById('canEq').classList.remove('novo');
    document.querySelectorAll('.dc-head .tab button').forEach(function (b) { b.classList.toggle('on', b.dataset.c === qual); });
  }
  document.querySelectorAll('.dc-head .tab button').forEach(function (b) { b.addEventListener('click', function () { verCanal(b.dataset.c); }); });
  var BOTN = esc(c.nome) + ' Bot', CMD = tr('/comprar', '/buy', '/comprar');
  function rodarDc() {
    grupo = 'dc'; limpar(); dcLoja.innerHTML = ''; dcEq.innerHTML = ''; verCanal('loja'); passo(pD, -1);
    dig.className = 'dc-dig'; dig.textContent = tr('Conversar em #comprar', 'Message #buy', 'Escribir en #comprar');
    em(400, function () { dig.className = 'dc-dig escreve'; dig.textContent = CMD + ' ' + ESCOLHA[1]; passo(pD, 0); });
    em(1500, function () { dig.className = 'dc-dig'; dig.textContent = tr('Conversar em #comprar', 'Message #buy', 'Escribir en #comprar'); msg(dcLoja, false, 'jogador_77', '<code>' + CMD + '</code> ' + esc(ESCOLHA[1])); });
    em(2700, function () {
      passo(pD, 1);
      msg(dcLoja, true, BOTN, '<div class="emb"><b>🛒 ' + esc(ESCOLHA[1]) + '</b>' + tr('Pedido #1042 criado. Pague para receber na hora.', 'Order #1042 created. Pay to receive it instantly.', 'Pedido #1042 creado. Paga para recibirlo al instante.') +
        '<div class="campos"><div><span>' + tr('Valor', 'Total', 'Valor') + '</span>' + preco(ESCOLHA[2]) + '</div><div><span>' + tr('Pagamento', 'Payment', 'Pago') + '</span>' + (BR ? 'Pix' : tr('', 'Card / PayPal / crypto', 'Tarjeta / PayPal / cripto')) + '</div></div>' +
        '<div class="dc-bts"><span>' + (BR ? 'Copiar Pix' : tr('', 'Pay now', 'Pagar ahora')) + '</span><span class="cinza">' + tr('Cancelar', 'Cancel', 'Cancelar') + '</span></div></div>');
    });
    em(5200, function () {
      passo(pD, 2);
      msg(dcLoja, true, BOTN, '<div class="emb ok"><b>✅ ' + tr('Pagamento confirmado', 'Payment confirmed', 'Pago confirmado') + '</b>' + tr('Pedido #1042 entregue: ' + esc(ESCOLHA[1]) + '. Bom jogo!', 'Order #1042 delivered: ' + esc(ESCOLHA[1]) + '. Have fun!', 'Pedido #1042 entregado: ' + esc(ESCOLHA[1]) + '. ¡Buen juego!') + '<div class="dc-bts"><span class="verde">⭐ ' + tr('Avaliar a compra', 'Rate the purchase', 'Calificar la compra') + '</span></div></div>');
      msg(dcEq, true, BOTN, '<div class="emb ok"><b>💰 ' + tr('Nova venda', 'New sale', 'Nueva venta') + '</b>#1042 · ' + esc(ESCOLHA[1]) + ' · ' + preco(ESCOLHA[2]) + ' · ' + tr('entregue automaticamente', 'delivered automatically', 'entregado automáticamente') + '</div>');
      document.getElementById('canEq').classList.add('novo');
    });
    em(6800, function () {
      msg(dcEq, true, BOTN, '<div class="emb aviso"><b>⚠️ ' + tr('Estoque baixo', 'Low stock', 'Stock bajo') + '</b>' + esc(ESCOLHA[1]) + ': ' + tr('restam 3. Reponha no painel.', '3 left. Restock in the dashboard.', 'quedan 3. Repón en el panel.') + '</div>');
    });
    em(8000, function () { passo(pD, 3); verCanal('eq'); });
  }
  document.getElementById('verDc').addEventListener('click', rodarDc);

  // Começa sozinho quando a parte aparece na tela (uma vez cada).
  if ('IntersectionObserver' in window && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
    var feito = {};
    var io = new IntersectionObserver(function (es) {
      es.forEach(function (e) {
        if (!e.isIntersecting || feito[e.target.id]) return;
        feito[e.target.id] = 1;
        if (e.target.id === 'cel') rodarLoja(); else rodarDc();
      });
    }, { threshold: .55 });
    io.observe(cel); io.observe(document.querySelector('.dc'));
  }
})();
</script>
</body></html>
