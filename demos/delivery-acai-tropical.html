<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6a1fd1">
<title>Açaí Tropical — Delivery próprio</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<script src="../i18n-pages.js"></script><script src="../i18n-delivery-demo.js"></script>
<style>
:root{--page:#efe6fb;--pcard:#fff;--pink:#2a1148;--pmu:#7c5fa6;--pline:#e0d0f5;--bg:#ffffff;--card:#f6efff;--ink:#2a1148;--mu:#7c5fa6;--line:#e8d9fb;--ac:#6a1fd1;--ac2:#c026d3;--acink:#fff;--price:#6a1fd1;--rad:26px;--f1:"Baloo 2",sans-serif;--f2:"Baloo 2",sans-serif;--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--page);color:var(--ink);font:400 15px/1.45 var(--f2);overflow-x:hidden;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}button,input,select{font:inherit}button{cursor:pointer}
.f1{font-family:var(--f1)}
/* ---------- barra de demonstração ---------- */
.demo{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;max-width:1500px;margin:auto;padding:16px 24px 8px}
.demo h1{margin:0;font:700 21px var(--f1);letter-spacing:-.01em}.demo p{margin:2px 0 0;color:var(--pmu);font-size:13px;max-width:62ch}
.dbt{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.dbt button,.dbt a{background:var(--pcard);color:var(--pink);border:1px solid var(--pline);border-radius:11px;padding:9px 14px;font-weight:600;font-size:13px;transition:.2s}.dbt button:hover,.dbt a:hover{transform:translateY(-1px);border-color:var(--ac)}.dbt .go{background:var(--ac);color:var(--acink);border-color:transparent}
.langsw{display:flex;border:1px solid var(--pline);border-radius:99px;padding:3px;background:var(--pcard)}.langsw button{border:0;background:none;color:var(--pmu);padding:5px 11px;border-radius:99px;font-weight:700;font-size:12px}.langsw button[aria-current="true"]{background:var(--ac);color:var(--acink)}
.stage{max-width:1500px;margin:auto;padding:14px 24px 44px;display:grid;grid-template-columns:372px minmax(0,1fr) 372px;gap:26px;align-items:start}
.col>.lb{font:700 11.5px var(--f2);letter-spacing:.16em;text-transform:uppercase;color:var(--pmu);margin:0 0 10px;display:flex;gap:8px;align-items:center}.lb i{width:8px;height:8px;border-radius:50%;background:#2fd77a;box-shadow:0 0 0 4px #2fd77a22;animation:pl 2s infinite}@keyframes pl{50%{box-shadow:0 0 0 7px #2fd77a00}}
.dev{background:var(--bg);color:var(--ink);border:10px solid #101018;border-radius:46px;height:740px;overflow:hidden;display:flex;flex-direction:column;position:relative;box-shadow:0 0 0 2px #2a2a38,0 40px 80px #0006,0 12px 24px #0003}
.dev::before{content:"";position:absolute;top:8px;left:50%;translate:-50% 0;width:92px;height:24px;border-radius:99px;background:#050508;z-index:30}
.dev.tab{border-radius:28px;border-width:11px}.dev.tab::before{display:none}
.sc{flex:1;overflow:auto;position:relative;scroll-behavior:auto;overscroll-behavior:contain}.sc::-webkit-scrollbar{width:0}
.sb{height:34px;flex:none;display:flex;justify-content:space-between;align-items:flex-end;padding:0 26px 4px;font-size:11.5px;font-weight:700;color:var(--ink);opacity:.8}
body.single .demo,body.single .col>.lb,body.single .mt{display:none!important}
body.single .stage{display:block;padding:0;max-width:none}body.single .col{display:none}body.single .col.on{display:block}
body.single .dev{height:100vh;border:0;border-radius:0;max-width:520px;margin:auto;box-shadow:none}body.single .dev::before{display:none}body.single .dev.tab{max-width:none}
.mt{display:none}
@media(max-width:1200px){.stage{grid-template-columns:1fr;padding:12px 14px 92px}.col{display:none}.col.on{display:block}.dev{max-width:440px;margin:auto;height:calc(100vh - 200px);min-height:580px}.dev.tab{max-width:none}
 .mt{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:50;background:color-mix(in srgb,var(--pcard) 92%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--pline);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0))}.mt button{flex:1;border:0;background:none;color:var(--pmu);font-weight:700;padding:10px 4px;border-radius:12px;font-size:13px}.mt button.on{background:var(--ac);color:var(--acink)}
 body.single .dev{height:100vh}}
/* ---------- CLIENTE ---------- */
.cover{position:relative;height:178px;background:linear-gradient(150deg,var(--ac),var(--ac2));color:var(--acink);overflow:hidden}
.cover::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 80% 20%,#ffffff40,transparent 55%),radial-gradient(circle at 10% 100%,#00000030,transparent 60%)}
.cover .plate{position:absolute;right:-26px;top:-6px;width:170px;height:170px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffffff,#ffffffcc 60%,#ffffff88);box-shadow:inset 0 -8px 20px #0002,0 18px 40px #0004;display:grid;place-items:center;font-size:86px;transform:rotate(-8deg);animation:fl 7s ease-in-out infinite}
@keyframes fl{50%{transform:rotate(-2deg) translateY(-6px)}}
.cover .plate span{filter:drop-shadow(0 8px 10px #0004)}
.cover .nav{position:absolute;left:16px;right:16px;top:8px;display:flex;justify-content:space-between;z-index:2}.cover .nav i{width:34px;height:34px;border-radius:50%;background:#ffffff33;backdrop-filter:blur(8px);display:grid;place-items:center;font-style:normal;font-size:15px}
.st-card{position:relative;margin:-34px 14px 0;background:var(--bg);border:1px solid var(--line);border-radius:22px;padding:16px;box-shadow:0 14px 34px #0000001f;z-index:2}
.st-card .lg{position:absolute;left:16px;top:-22px;width:50px;height:50px;border-radius:16px;background:linear-gradient(135deg,var(--ac),var(--ac2));color:var(--acink);display:grid;place-items:center;font-size:26px;border:3px solid var(--bg);box-shadow:0 6px 14px #0003}
.st-card .nm{margin:22px 0 0;font:800 21px/1.1 var(--f1);letter-spacing:-.01em}.st-card .tg{color:var(--mu);font-size:13px;margin:3px 0 12px}
.meta{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.meta div{background:var(--card);border-radius:14px;padding:8px 6px;text-align:center}.meta b{display:block;font:800 14px var(--f1)}.meta small{color:var(--mu);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em}
.open{display:inline-flex;gap:6px;align-items:center;font-size:12px;font-weight:700;color:#14a35c;background:#14a35c1a;border-radius:99px;padding:3px 10px;margin-bottom:8px}.open::before{content:"";width:7px;height:7px;border-radius:50%;background:#14a35c}
.chips{display:flex;gap:8px;overflow-x:auto;padding:14px 14px 6px;scrollbar-width:none;position:sticky;top:0;background:linear-gradient(var(--bg) 80%,transparent);z-index:3}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--mu);border-radius:99px;padding:8px 15px;font-weight:700;font-size:13px;transition:.2s}.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.cat{padding:14px 16px 4px;font:800 18px var(--f1);letter-spacing:-.01em}
.items{padding:6px 14px 100px;display:grid;gap:12px}
.it{background:var(--bg);border:1px solid var(--line);border-radius:var(--rad);padding:12px;display:grid;grid-template-columns:1fr 92px;gap:12px;align-items:center;transition:.25s var(--ease);box-shadow:0 2px 0 #0000000a;position:relative;cursor:pointer}
.it:hover{transform:translateY(-2px);box-shadow:0 14px 28px #00000014}.it:active{transform:scale(.985)}
.it b{display:block;font:700 15.5px/1.2 var(--f2)}.it .d{color:var(--mu);font-size:12.5px;margin:4px 0 8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.it .p{font:800 16px var(--f1);color:var(--price)}
.it .bg{position:absolute;left:12px;top:-8px;background:var(--ink);color:var(--bg);font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:3px 9px;border-radius:99px}
.art{width:92px;height:92px;border-radius:50%;background:radial-gradient(circle at 35% 28%,#fff,#ffffffd0 55%,#f1f1f1);box-shadow:inset 0 -6px 14px #0001,0 10px 20px color-mix(in srgb,var(--b) 35%,transparent);display:grid;place-items:center;font-size:48px;position:relative;margin:auto}
.art::before{content:"";position:absolute;inset:-6px;border-radius:50%;background:linear-gradient(135deg,var(--a),var(--b));z-index:-1;opacity:.9}
.art span.e{filter:drop-shadow(0 6px 6px #0003)}
.art .ad{position:absolute;right:-4px;bottom:-4px;min-width:32px;height:32px;padding:0 6px;border-radius:99px;border:3px solid var(--bg);background:var(--ac);color:var(--acink);font-weight:800;font-size:16px;display:grid;place-items:center;line-height:0}
.lay-grid .items{grid-template-columns:1fr 1fr}.lay-grid .it{grid-template-columns:1fr;padding:12px 10px;gap:8px;text-align:center}.lay-grid .art{order:-1;width:104px;height:104px;font-size:54px}.lay-grid .it .d{display:none}
.lay-big .it{grid-template-columns:1fr;text-align:center}.lay-big .art{order:-1;width:150px;height:150px;font-size:80px}
.cbar{position:absolute;left:14px;right:14px;bottom:16px;background:var(--ink);color:var(--bg);border:0;border-radius:18px;padding:14px 18px;font-weight:700;display:flex;justify-content:space-between;align-items:center;box-shadow:0 18px 40px #0005;z-index:5;animation:up .4s var(--ease)}
.cbar b{background:var(--ac);color:var(--acink);border-radius:99px;min-width:24px;height:24px;display:inline-grid;place-items:center;margin-right:8px;font-size:12px}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.hd{display:flex;align-items:center;gap:10px;padding:10px 16px;font:800 18px var(--f1);position:sticky;top:0;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(12px);z-index:4;border-bottom:1px solid var(--line)}.hd button{border:1px solid var(--line);background:var(--card);color:var(--ink);width:36px;height:36px;border-radius:50%;font-size:16px}
.sec{padding:16px;border-bottom:1px solid var(--line)}.sec h4{margin:0 0 10px;font:700 11.5px var(--f2);color:var(--mu);text-transform:uppercase;letter-spacing:.12em}
.ci{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center;margin-bottom:12px}.ci .art{width:48px;height:48px;font-size:25px;box-shadow:none}.ci .art::before{inset:-3px}.ci b{display:block;font-size:14px}.ci small{color:var(--mu)}
.qt{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:3px}.qt button{width:28px;height:28px;border:0;border-radius:50%;background:var(--ink);color:var(--bg);font-weight:800}.qt span{min-width:16px;text-align:center;font-weight:700}
.in{width:100%;background:var(--card);border:1.5px solid var(--line);color:var(--ink);border-radius:14px;padding:12px 14px;outline:0;transition:.2s}.in:focus{border-color:var(--ac);box-shadow:0 0 0 4px color-mix(in srgb,var(--ac) 18%,transparent)}
.row{display:flex;gap:8px}.row .btn{flex:none}
.btn{border:0;background:var(--ac);color:var(--acink);font-weight:800;padding:12px 18px;border-radius:14px;transition:.2s var(--ease)}.btn:hover{filter:brightness(1.06)}.btn:active{transform:scale(.97)}.btn.g{background:var(--card);color:var(--ink);border:1px solid var(--line)}.btn.w{width:100%;padding:16px;font-size:16px;border-radius:16px;box-shadow:0 12px 26px color-mix(in srgb,var(--ac) 40%,transparent)}.btn.k{background:var(--ink);color:var(--bg)}.btn:disabled{opacity:.45;box-shadow:none}
.pays{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.pays button{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:12px 4px;font-weight:700;font-size:13px;transition:.2s}.pays button.on{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 12%,var(--card))}
.sum div{display:flex;justify-content:space-between;padding:4px 0;color:var(--mu)}.sum .t{color:var(--ink);font:800 19px var(--f1);border-top:1px dashed var(--line);margin-top:8px;padding-top:12px}.sum .dc{color:#14a35c;font-weight:700}
.msg{font-size:12.5px;margin-top:8px;font-weight:700}.msg.ok{color:#14a35c}.msg.er{color:#e5484d}
.note{display:flex;gap:10px;align-items:flex-start;background:color-mix(in srgb,var(--ac) 9%,var(--card));border-radius:14px;padding:10px 12px;font-size:12.5px;color:var(--mu);margin-top:10px}.note b{color:var(--ink)}.note i{font-style:normal;font-size:18px}
.map{width:100%;border-radius:18px;display:block;border:1px solid var(--line);box-shadow:0 10px 24px #0000001a}
.mapfr{width:100%;height:220px;border:0;border-radius:18px;display:block}
.mt2{display:flex;gap:8px;margin:10px 0 0}.mt2 button,.mt2 a{flex:1;text-align:center;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px;border-radius:12px;font-weight:700;font-size:12.5px}
.big{text-align:center;padding:18px 18px 8px}.big .e{font-size:56px;display:block;animation:pop .6s var(--ease)}@keyframes pop{from{transform:scale(.4);opacity:0}}.big h2{margin:6px 0 2px;font:800 23px/1.1 var(--f1);letter-spacing:-.01em}.big p{margin:0;color:var(--mu)}
.eta{display:flex;align-items:center;justify-content:center;gap:12px;margin:12px 16px 0;background:var(--ink);color:var(--bg);border-radius:20px;padding:12px 16px}.eta b{font:800 30px var(--f1);line-height:1}.eta small{opacity:.7;display:block;font-size:11.5px}.eta .lv{margin-left:auto;display:flex;gap:6px;align-items:center;font-size:11.5px;font-weight:700;color:#7dffb4}.eta .lv::before{content:"";width:8px;height:8px;border-radius:50%;background:#2fd77a;animation:pl 1.6s infinite}
.tm{padding:6px 18px}.tm div{display:grid;grid-template-columns:22px 1fr auto;gap:12px;padding:0 0 14px;position:relative;opacity:.4;transition:.4s}.tm div::before{content:"";position:absolute;left:10px;top:20px;bottom:-2px;width:2px;background:var(--line)}.tm div:last-child::before{display:none}.tm div i{width:22px;height:22px;border-radius:50%;background:var(--card);border:2px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:11px;z-index:1}.tm div.on{opacity:1}.tm div.on i{background:#14a35c;border-color:#14a35c;color:#fff}.tm div.now i{animation:pl2 1.6s infinite}@keyframes pl2{50%{box-shadow:0 0 0 6px #14a35c33}}
.tm b{font-size:14px}.tm small{color:var(--mu);font-variant-numeric:tabular-nums;font-size:12px}
.cour{display:flex;gap:12px;align-items:center;margin:12px 16px 0;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px}.cour .av{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,var(--ac),var(--ac2));color:var(--acink);display:grid;place-items:center;font:800 18px var(--f1)}.cour b{display:block}.cour small{color:var(--mu);font-size:12px}.cour .bt{margin-left:auto;display:flex;gap:6px}.cour .bt button{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--bg);font-size:16px}
.code{margin:12px 16px 0;background:var(--card);border:2px dashed var(--ac);border-radius:18px;padding:12px;text-align:center}.code b{display:block;font:800 30px var(--f1);letter-spacing:.34em;color:var(--ac);padding-left:.34em}.code small{color:var(--mu)}
.banner{margin:12px 16px 0;border-radius:16px;padding:12px 14px;display:flex;gap:10px;align-items:center;font-weight:700;font-size:14px;animation:up .4s var(--ease)}.banner.ar{background:#fff4d6;color:#7a5200;border:1px solid #ffd980}.banner.ok{background:#dcfbe8;color:#0a6b3a;border:1px solid #9be7bd}.banner i{font-style:normal;font-size:22px}
.chat{display:grid;gap:6px;max-height:150px;overflow:auto;margin-bottom:8px}.bb{max-width:82%;padding:8px 12px;border-radius:16px;font-size:13.5px;animation:up .3s}.bb.me{background:var(--ink);color:var(--bg);margin-left:auto;border-bottom-right-radius:4px}.bb.lj{background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px}
.stars{display:flex;gap:6px;justify-content:center;font-size:32px;margin:6px 0}.stars button{border:0;background:none;padding:0;filter:grayscale(1);opacity:.45;transition:.2s}.stars button.on{filter:none;opacity:1;transform:scale(1.1)}
.toast{position:absolute;left:12px;right:12px;top:44px;z-index:40;background:#fff;color:#16161d;border-radius:18px;padding:11px 15px;box-shadow:0 18px 44px #0007;font-size:13px;transform:translateY(-140px);transition:transform .55s cubic-bezier(.2,1.3,.4,1)}.toast.on{transform:none}.toast b{display:block}
/* pagamento Pix */
.qr{width:176px;height:176px;margin:12px auto;border:10px solid #fff;border-radius:14px;box-shadow:0 12px 30px #0002;background:repeating-conic-gradient(#111 0 25%,#fff 0 50%) 0 0/22px 22px;position:relative}
.qr::after{content:"Pix";position:absolute;inset:50% auto auto 50%;translate:-50% -50%;background:#fff;color:#14a35c;font:800 17px var(--f1);padding:6px 10px;border-radius:10px;box-shadow:0 0 0 4px #fff}
.cp{display:flex;gap:8px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 8px 8px 12px;font:12px ui-monospace,Consolas,monospace;color:var(--mu);overflow:hidden}.cp span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cp button{border:0;background:var(--ink);color:var(--bg);border-radius:10px;padding:8px 12px;font-weight:700;font-size:12px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--ac);border-radius:50%;animation:rt .8s linear infinite;vertical-align:-2px;margin-right:6px}@keyframes rt{to{transform:rotate(360deg)}}
/* ---------- COZINHA ---------- */
.kh{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}.kh b{font:800 20px var(--f1)}.kh small{display:block;color:var(--mu);font-size:12px}
.kc{display:flex;gap:8px;flex-wrap:wrap}.kc span{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:5px 11px;font-size:12px;color:var(--mu);font-weight:700}.kc b{font:800 16px var(--f1);color:var(--ink);margin-right:5px}.kh button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:8px 13px;font-weight:700;font-size:12.5px}
.kb{display:grid;grid-template-columns:repeat(4,minmax(160px,1fr));gap:12px;padding:14px;align-items:start;overflow:auto;flex:1;min-height:0;background:color-mix(in srgb,var(--card) 55%,var(--bg))}
.kcol h5{margin:0 0 10px;font:800 12px var(--f2);text-transform:uppercase;letter-spacing:.12em;display:flex;justify-content:space-between;align-items:center;color:var(--col)}.kcol h5 em{font-style:normal;background:var(--col);color:#fff;border-radius:99px;min-width:22px;text-align:center;padding:1px 8px;font-size:11px}
.ko{background:var(--bg);border:1px solid var(--line);border-top:4px solid var(--col);border-radius:16px;padding:12px;margin-bottom:12px;animation:up .45s var(--ease);box-shadow:0 8px 20px #0000000d}
.ko.new{animation:flash 1.2s 2}@keyframes flash{50%{background:color-mix(in srgb,var(--col) 22%,var(--bg))}}
.ko .h{display:flex;justify-content:space-between;align-items:baseline}.ko .h b{font:800 17px var(--f1)}.ko .h span{font-weight:800;font-size:13px;font-variant-numeric:tabular-nums;color:var(--mu);background:var(--card);border-radius:8px;padding:2px 8px}.ko .h span.late{color:#fff;background:#e5484d}
.ko .c{font-size:12.5px;color:var(--mu);margin:2px 0 8px}.ko ul{margin:0 0 8px;padding:0;list-style:none;font-size:14px}.ko li{padding:2px 0}.ko li b{color:var(--ac)}
.ko .nt{font-size:12px;background:color-mix(in srgb,#ffb020 22%,var(--bg));border-radius:10px;padding:6px 9px;margin-bottom:8px}
.ko .pb{display:inline-block;font-size:11px;font-weight:800;border-radius:99px;padding:3px 9px;margin-bottom:8px}.pb.ok{background:#14a35c1f;color:#14a35c}.pb.cash{background:#ffb02033;color:#b46a00}
.ko .ac{display:flex;gap:6px}.ko .ac button{flex:1;border:0;border-radius:12px;padding:11px 4px;font-weight:800;font-size:13px;background:var(--col);color:#fff}.ko .ac button.g{flex:none;background:var(--card);color:var(--ink);border:1px solid var(--line)}
.ko .cx{margin-top:8px;border-top:1px dashed var(--line);padding-top:8px}.ko .cx .in{padding:8px 10px;font-size:13px}
.ko .tg2{font-size:12px;color:var(--mu);margin-bottom:6px}
.mini{font-size:11.5px;color:var(--mu)}
/* ---------- MOTOBOY ---------- */
.mdev{background:#0d0e14;color:#f2f3f8}

<body class="lay-grid">

<div class="dbt"><div id="langsw"></div><button class="go" data-a="fake">＋ Pedido de outro cliente</button><button data-a="reset">↺ Reiniciar demo</button><a href="?view=cliente" target="_blank">App do cliente ↗</a><a href="?view=cozinha" target="_blank">Cozinha ↗</a><a href="?view=motoboy" target="_blank">Motoboy ↗</a></div></div>

<script>
const CFG={"slug": "delivery-acai-tropical", "accent": "#6a1fd1", "mapBg": "#efe6fb", "road": "#ffffff", "store": {"name": "Açaí Tropical", "tag": "Açaí, bowls e sucos · gelado na hora", "emoji": "🍇", "rating": "4,7", "eta": "20-30 min", "fee": 4.9, "pay": 6.5, "addr": "Rua da Praia, 45 - Santos"}, "menu": [{"name": "Açaí", "items": [{"id": "at1", "name": "Açaí 300ml", "desc": "Com banana e granola", "price": 16.9, "e": "🍇", "a": "#c9a2ff", "b": "#6a1fd1"}, {"id": "at2", "name": "Açaí 500ml", "desc": "Escolha 3 acompanhamentos", "price": 24.9, "e": "🍨", "a": "#d9b3ff", "b": "#8a3de8"}, {"id": "at3", "name": "Açaí 700ml", "desc": "Escolha 4 acompanhamentos", "price": 32.9, "e": "🍇", "a": "#b98cff", "b": "#5a17b8"}]}, {"name": "Bowls e sucos", "items": [{"id": "at4", "name": "Bowl Tropical", "desc": "Pitaya, manga, coco e granola", "price": 27.9, "e": "🥭", "a": "#ffe08a", "b": "#ff8a5c"}, {"id": "at5", "name": "Suco Verde", "desc": "Couve, limão, gengibre e maçã", "price": 13.9, "e": "🥬", "a": "#c8f08a", "b": "#5cc26a"}, {"id": "at6", "name": "Vitamina de Morango", "desc": "Com leite e mel", "price": 15.9, "e": "🍓", "a": "#ffc2d1", "b": "#ff6b8b"}]}, {"name": "Adicionais", "items": [{"id": "at7", "name": "Leite Condensado", "desc": "Porção extra", "price": 3.0, "e": "🥛", "a": "#fff3cf", "b": "#f0d58a"}, {"id": "at8", "name": "Paçoca", "desc": "Porção extra", "price": 3.5, "e": "🥜", "a": "#f3dcc0", "b": "#d9a066"}]}]};
const KEY='dlv3-'+CFG.slug,ROUTE_MS=42000,PIX_MS=6000;
const $=id=>document.getElementById(id),qa=(s,r=document)=>[...r.querySelectorAll(s)];
const R=v=>'R$ '+v.toFixed(2).replace('.',',');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hm=ts=>new Date(ts).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
const STAT={pgto:['Aguardando pagamento','💳','#94a3b8'],novo:['Pedido recebido','🧾','#3b82f6'],preparando:['Em preparo','👨‍🍳','#f59e0b'],pronto:['Pronto','✅','#10b981'],rota:['Saiu para entrega','🛵','#8b5cf6'],entregue:['Entregue','🎉','#64748b']};
const ALL=CFG.menu.flatMap(c=>c.items.map(i=>Object.assign({cat:c.name},i)));
const byId=id=>ALL.find(i=>i.id===id);
const NAMES=['Marcos','Larissa','Thor','Kaique','Bia','Dante','Mel','Rafa','Júlia','Pedro'],ADDR=['Rua das Flores, 120','Av. Brasil, 455','Rua do Sol, 78 ap 32','Praça Central, 9','Rua Verde, 301','Av. das Palmeiras, 1500'];
const bc=window.BroadcastChannel?new BroadcastChannel(KEY):null;
let S=load();
function mk(id,st,min,who,items,addr,notes,pay){const t=Date.now();return{id,cust:who,items,addr,pay:pay||'Pix',paid:(pay||'Pix')!=='Dinheiro',notes:notes||'',st,t:{novo:t-min*60000},chat:[],code:String(1000+Math.floor(Math.random()*9000)),fee:CFG.store.fee,disc:0}}
function seed(){const t=Date.now(),it=ALL;const a=mk(4819,'preparando',9,'Marcos',[[it[0].id,2],[it[3%it.length].id,1]],ADDR[0],'Sem cebola');a.t.preparando=t-7*60000;const b=mk(4820,'novo',2,'Larissa',[[it[1].id,1],[it[2].id,2]],ADDR[1]);return{v:3,seq:4821,gps:false,orders:[a,b]}}
function load(){try{const j=JSON.parse(localStorage.getItem(KEY));if(j&&j.v===3)return j}catch(e){}return seed()}
function save(){S.orders=S.orders.filter((o,i,a)=>o.st!=='entregue'||a.length-i<=14);try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}bc&&bc.postMessage(1)}
if(bc)bc.onmessage=()=>{S=load();renderAll()};addEventListener('storage',e=>{if(e.key===KEY){S=load();renderAll()}});
const sub=o=>o.items.reduce((s,[id,q])=>s+byId(id).price*q,0),total=o=>sub(o)-o.disc+o.fee;
const prog=o=>o.st==='entregue'?1:o.st==='rota'?Math.min((Date.now()-o.t.routeStart)/ROUTE_MS,1):0;
const L={screen:'menu',cart:{},cat:'Todos',coupon:null,cmsg:'',addr:ADDR[0],compl:'',pay:'Pix',my:+(localStorage.getItem(KEY+'-my')||0)||null,real:false,seen:null,lastSt:{},sound:true,rated:0,geo:false,msig:''};
const art=i=>`<div class="art" style="--a:${i.a};--b:${i.b}"><span class="e">${i.e}</span></div>`;
const find=id=>S.orders.find(o=>o.id===id);
function setSt(o,st){o.st=st;o.t[st]=Date.now();if(st==='rota'){o.t.routeStart=Date.now();if(!o.courier)o.courier='Carlos'}save();renderAll()}
function payOk(o){if(o.st!=='pgto')return;o.paid=true;o.st='novo';o.t.novo=Date.now();save();renderAll()}
/* ---------- mapa ---------- */
const PATH='M44 164 L44 112 L156 112 L156 54 L276 54';
function mapSVG(o,dark){const bg=dark?'#161a26':(CFG.mapBg||'#e9eef3'),rd=dark?'#262c42':(CFG.road||'#fff'),blk=dark?'#1d2233':'#00000010';
 return `<svg class="map" viewBox="0 0 320 210" data-oid="${o.id}"><defs><filter id="sh${o.id}"><feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-opacity=".35"/></filter></defs><rect width="320" height="210" fill="${bg}"/>
 <path d="M0 196 C60 176 90 206 150 192 S260 176 320 196 V210 H0Z" fill="${dark?'#16314a':'#bfdcf2'}"/>
 <g fill="${blk}"><rect x="8" y="8" width="30" height="36" rx="5"/><rect x="50" y="8" width="44" height="36" rx="5"/><rect x="108" y="8" width="42" height="36" rx="5"/><rect x="164" y="8" width="44" height="36" rx="5"/><rect x="222" y="8" width="46" height="36" rx="5"/><rect x="284" y="8" width="30" height="36" rx="5"/><rect x="8" y="64" width="30" height="40" rx="5"/><rect x="50" y="64" width="44" height="40" rx="5"/><rect x="164" y="64" width="44" height="40" rx="5"/><rect x="222" y="64" width="46" height="40" rx="5"/><rect x="284" y="64" width="30" height="40" rx="5"/><rect x="8" y="122" width="30" height="34" rx="5"/><rect x="50" y="122" width="44" height="34" rx="5"/><rect x="284" y="122" width="30" height="34" rx="5"/></g>
 <rect x="108" y="120" width="42" height="38" rx="8" fill="${dark?'#173a2a':'#bfe3c4'}" opacity=".9"/><rect x="164" y="120" width="104" height="38" rx="8" fill="${dark?'#1d2640':'#d3e2f5'}" opacity=".9"/>
 <g stroke="${rd}" stroke-width="9" stroke-linecap="round" fill="none"><path d="M0 112H320M0 54H320M0 164H320M44 0V210M156 0V210M276 0V210M100 0V210M214 0V210"/></g>
 <path class="rt" d="${PATH}" fill="none" stroke="${CFG.accent}" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" opacity=".18"/><path class="rt2" d="${PATH}" fill="none" stroke="${CFG.accent}" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1 8"/>
 <g filter="url(#sh${o.id})"><circle cx="44" cy="164" r="13" fill="#fff"/><text x="44" y="170" text-anchor="middle" font-size="15">🏪</text><circle cx="276" cy="54" r="13" fill="#fff"/><text x="276" y="60" text-anchor="middle" font-size="15">🏠</text></g>
 <g class="cr"><circle class="pu" r="12" fill="${CFG.accent}" opacity=".3"/><circle r="12" fill="${CFG.accent}" stroke="#fff" stroke-width="3"/><text y="5.5" text-anchor="middle" font-size="14">🛵</text></g></svg>`}
function moveCouriers(){qa('svg.map[data-oid]').forEach(s=>{const o=find(+s.dataset.oid);if(!o)return;const p=s.querySelector('.rt'),n=p.getTotalLength(),pt=p.getPointAtLength(n*prog(o));s.querySelector('.cr').setAttribute('transform','translate('+pt.x+','+pt.y+')')})}
function gmaps(o){return 'https://www.google.com/maps/dir/?api=1&travelmode=motorcycle&origin='+encodeURIComponent(CFG.store.addr)+'&destination='+encodeURIComponent(o.addr||L.addr)}
function realMap(addr){return `<iframe class="mapfr" loading="lazy" src="https://www.google.com/maps?output=embed&saddr=${encodeURIComponent(CFG.store.addr)}&daddr=${encodeURIComponent(addr)}"></iframe>`}
/* ---------- CLIENTE ---------- */
const cartItems=()=>Object.entries(L.cart).filter(([,q])=>q>0);
const cartSub=()=>cartItems().reduce((s,[id,q])=>s+byId(id).price*q,0);
const cartFee=()=>L.coupon==='FRETEGRATIS'?0:CFG.store.fee;
const cartDisc=()=>L.coupon==='BEMVINDO10'?cartSub()*.1:0;
function stepsFor(o){const T=o.t;return[['Pedido recebido',T.novo,o.st!=='pgto'],['Em preparo',T.preparando,!!T.preparando],['Pronto para retirada',T.pronto,!!T.pronto],['Saiu para entrega',T.rota,!!T.rota],['Entregador chegou',T.arrived,!!o.arrived],['Entregue',T.entregue,o.st==='entregue']]}
function cliente(){const el=$('cliente');const sc=el.querySelector('.sc');const top=sc?sc.scrollTop:0;let h='<div class="sb"><span>9:41</span><span>5G ▮</span></div><div class="sc">';
 if(L.screen==='menu'){const cats=['Todos',...CFG.menu.map(c=>c.name)];
  h+=`<div class="cover"><div class="nav"><i>←</i><i>♡</i></div><div class="plate"><span>${CFG.store.emoji}</span></div></div>
  <div class="st-card"><div class="lg">${CFG.store.emoji}</div><div class="nm">${esc(CFG.store.name)}</div><div class="tg">${esc(CFG.store.tag)}</div><span class="open">Aberto até 23h</span><div class="meta"><div><b>★ ${CFG.store.rating}</b><small>Avaliação</small></div><div><b>${CFG.store.eta}</b><small>Tempo</small></div><div><b>${CFG.store.fee?R(CFG.store.fee):'Grátis'}</b><small>Entrega</small></div></div></div>
  <div class="chips">${cats.map(c=>`<button class="chip ${L.cat===c?'on':''}" data-a="cat" data-c="${esc(c)}">${esc(c)}</button>`).join('')}</div>`;
  CFG.menu.filter(c=>L.cat==='Todos'||L.cat===c.name).forEach((c,ci)=>{h+=`<div class="cat">${esc(c.name)}</div><div class="items">${c.items.map((i,k)=>`<div class="it" data-a="add" data-id="${i.id}">${ci===0&&k===0?'<span class="bg">Mais pedido</span>':''}<div><b>${esc(i.name)}</b><div class="d">${esc(i.desc)}</div><div class="p">${R(i.price)}</div></div><div class="art" style="--a:${i.a};--b:${i.b}"><span class="e">${i.e}</span><span class="ad">${L.cart[i.id]?L.cart[i.id]:'+'}</span></div></div>`).join('')}</div>`});
  const n=cartItems().reduce((s,[,q])=>s+q,0);h+='<div style="height:20px"></div></div>';if(n)h+=`<button class="cbar" data-a="cart"><span><b>${n}</b>Ver sacola</span><span>${R(cartSub())}</span></button>`;
 }else if(L.screen==='cart'){const it=cartItems(),s=cartSub(),d=cartDisc(),f=cartFee();
  h+=`<div class="hd"><button data-a="menu">←</button>Sua sacola</div>
  <div class="sec">${it.map(([id,q])=>{const i=byId(id);return `<div class="ci">${art(i)}<div><b>${esc(i.name)}</b><small>${R(i.price)}</small></div><div class="qt"><button data-a="dec" data-id="${id}">−</button><span>${q}</span><button data-a="inc" data-id="${id}">+</button></div></div>`}).join('')||'<div class="mini" style="text-align:center;padding:20px">Sacola vazia</div>'}</div>
  <div class="sec"><h4>Cupom</h4><div class="row"><input class="in" id="cup" placeholder="Ex.: BEMVINDO10" value="${L.coupon||''}"><button class="btn" data-a="coupon">Aplicar</button></div><div class="msg ${L.cmsg.startsWith('✓')?'ok':'er'}">${L.cmsg}</div></div>
  <div class="sec"><h4>Endereço de entrega</h4><input class="in" id="adr" value="${esc(L.addr)}"><input class="in" id="cpl" style="margin-top:8px" placeholder="Complemento ou ponto de referência" value="${esc(L.compl)}"><div class="mt2"><button data-a="geo">📍 Usar minha localização</button><button data-a="real">${L.real?'Ver mapa simples':'🗺 Google Maps'}</button></div>
  <div id="mapbox" style="margin-top:10px">${L.real?realMap(L.addr):mapSVG({id:'cart',st:'novo',t:{}})}</div>
  <div class="note"><i>🔒</i><div><b>Você não precisa compartilhar sua localização.</b> Usamos só o endereço do pedido. O botão acima é opcional, só para preencher o endereço.</div></div></div>
  <div class="sec"><h4>Pagamento</h4><div class="pays">${['Pix','Cartão','Dinheiro'].map(m=>`<button class="${L.pay===m?'on':''}" data-a="pay" data-m="${m}">${m==='Pix'?'⚡ ':m==='Cartão'?'💳 ':'💵 '}${m}</button>`).join('')}</div>
  <div class="note"><i>${L.pay==='Pix'?'⚡':L.pay==='Cartão'?'💳':'💵'}</i><div>${L.pay==='Pix'?'Pix confirmado na hora. O valor cai direto na conta do restaurante.':L.pay==='Cartão'?'Pagamento seguro. O restaurante recebe pelo prazo do cartão.':'Pague ao entregador. Informe o troco se precisar.'}</div></div></div>
  <div class="sec sum"><div><span>Subtotal</span><span>${R(s)}</span></div>${d?`<div class="dc"><span>Cupom</span><span>− ${R(d)}</span></div>`:''}<div><span>Entrega</span><span>${f?R(f):'Grátis'}</span></div><div class="t"><span>Total</span><span>${R(s-d+f)}</span></div></div>
  <div class="sec" style="border:0;padding-bottom:34px"><button class="btn w" data-a="order" ${it.length?'':'disabled'}>Fazer pedido · ${R(s-d+f)}</button></div>`;
 }else{const o=find(L.my);if(!o){L.screen='menu';return cliente()}const p=prog(o),eta=Math.max(1,Math.ceil((1-p)*10));
  h+=`<div class="hd"><button data-a="menu">←</button>Pedido #${o.id}</div>`;
  if(o.st==='pgto'){const left=Math.max(0,600000-(Date.now()-o.t.pgto));h+=`<div class="big"><span class="e">⚡</span><h2>Pague com Pix</h2><p>Total ${R(total(o))}</p></div><div class="qr"></div>
   <div class="sec"><div class="cp"><span>00020126580014br.gov.bcb.pix0136${o.code}-8f2a-4c1b-9d7e520400005303986540${total(o).toFixed(2)}</span><button data-a="copy">Copiar</button></div>
   <div class="note"><i>⏱</i><div><b>Aguardando pagamento… <span class="spin"></span></b>A confirmação chega do banco em tempo real (webhook). Expira em <b data-ex="${o.t.pgto}">${mmss(left)}</b>.</div></div>
   <div class="note"><i>🏦</i><div>O Pix é gerado pela API do banco e o dinheiro cai <b>direto na conta do restaurante</b>.</div></div><button class="btn k w" style="margin-top:12px" data-a="paynow">Simular pagamento</button></div>`;
  }else{
   h+=`<div class="big"><span class="e">${o.arrived&&o.st==='rota'?'📍':STAT[o.st][1]}</span><h2>${o.st==='rota'?(o.arrived?'Seu entregador chegou':o.near?'Seu entregador está chegando':'Seu pedido está a caminho'):STAT[o.st][0]}</h2><p>${o.st==='rota'?(o.arrived?'Informe o código de entrega':'Acompanhe o trajeto em tempo real'):o.st==='entregue'?'Bom apetite!':o.st==='novo'?'Aguardando a loja confirmar':o.st==='preparando'?'A cozinha está preparando':'Aguardando o motoboy retirar'}</p></div>`;
   if(o.st==='rota'&&o.near&&!o.arrived)h+='<div class="banner ar"><i>🔔</i><div>Chegando! Fique atento ao interfone ou à campainha.</div></div>';
   if(o.arrived&&o.st==='rota')h+='<div class="banner ok"><i>📍</i><div>O entregador está no seu endereço.</div></div>';
   if(o.st==='rota')h+=`<div class="eta"><div><b>${o.arrived?'0':eta} min</b><small>${o.arrived?'No local':'Chegada estimada'}</small></div><div class="lv">Localização ao vivo</div></div>`;
   if(o.st==='rota'||o.st==='pronto'&&o.courier)h+=`<div class="cour"><div class="av">C</div><div><b>${esc(o.courier||'Carlos')}</b><small>★ 4,9 · Honda CG 160 · FGH-2J45</small></div><div class="bt"><button data-a="call" title="Ligar (número protegido)">📞</button><button data-a="chatfocus" title="Chat">💬</button></div></div>`;
   if(o.st==='rota')h+=`<div class="code"><small>Código de entrega · informe ao motoboy</small><b>${o.code}</b></div>`;
   h+=`<div class="sec" style="border:0">${L.real?realMap(o.addr):mapSVG(o)}<div class="mt2"><button data-a="real">${L.real?'Ver mapa simples':'🗺 Mapa real'}</button><a href="${gmaps(o)}" target="_blank" rel="noopener">Google Maps ↗</a><button data-a="share">🔗 Compartilhar</button></div></div>
   <div class="sec" style="padding-top:0"><h4>Acompanhamento</h4><div class="tm">${stepsFor(o).map(([n,t,on],i,a)=>`<div class="${on?'on':''} ${on&&a[i+1]&&!a[i+1][2]&&o.st!=='entregue'?'now':''}"><i>${on?'✓':''}</i><b>${n}</b><small>${t&&on?hm(t):''}</small></div>`).join('')}</div></div>
   <div class="sec"><h4>Fale com a loja</h4><div class="chat" id="cchat">${o.chat.map(m=>`<div class="bb ${m.f==='c'?'me':'lj'}">${esc(m.t)}</div>`).join('')||'<div class="mini">Dúvida sobre o pedido? Escreva aqui.</div>'}</div><div class="row"><input class="in" id="cmsg" data-enter="csend" placeholder="Escreva uma mensagem"><button class="btn" id="csend" data-a="csend">Enviar</button></div></div>
   <div class="sec"><h4>Resumo</h4><div class="sum">${o.items.map(([id,q])=>`<div><span>${q}× ${esc(byId(id).name)}</span><span>${R(byId(id).price*q)}</span></div>`).join('')}<div><span>Entrega</span><span>${o.fee?R(o.fee):'Grátis'}</span></div><div class="t"><span>Total · ${o.pay}</span><span>${R(total(o))}</span></div></div></div>
   ${o.st==='entregue'?`<div class="sec"><h4>Avalie</h4><div class="stars">${[1,2,3,4,5].map(n=>`<button class="${L.rated>=n?'on':''}" data-a="star" data-n="${n}">⭐</button>`).join('')}</div><button class="btn w" data-a="again">Fazer novo pedido</button></div>`:'<div style="height:30px"></div>'}`}}
 h+='</div><div class="toast" id="toast"></div>';el.innerHTML=h;const n=el.querySelector('.sc');if(n)n.scrollTop=top;moveCouriers();const c=el.querySelector('#cchat');if(c)c.scrollTop=1e5}
function toast(t,b){const e=$('toast');if(!e)return;e.innerHTML=`<b>${b}</b>${t}`;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),3000)}
/* ---------- COZINHA ---------- */
const mmss=ms=>{const s=Math.max(0,Math.floor(ms/1000));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
function cozinha(){const el=$('cozinha');const open=qa('.cx',el).map(x=>x.dataset.o);const val=($('kin')||{}).value;const fo=document.activeElement&&document.activeElement.id==='kin';
 const ord=S.orders.filter(o=>o.st!=='pgto').sort((a,b)=>a.t.novo-b.t.novo),cols=[['novo','Novos'],['preparando','Preparando'],['pronto','Prontos'],['rota','Em rota']];
 const cnt=s=>ord.filter(o=>o.st===s).length;
 let h=`<div class="sb"><span>${CFG.store.name}</span><span>${hm(Date.now())}</span></div><div class="kh"><div><b>Cozinha</b><small>Pedidos na ordem de chegada</small></div><div class="kc">${cols.map(([s,n])=>`<span><b>${cnt(s)}</b>${n}</span>`).join('')}<span><b>${cnt('entregue')}</b>Entregues</span></div><button data-a="ksound">${L.sound?'🔔 Som ligado':'🔕 Som desligado'}</button></div><div class="kb">`;
 cols.forEach(([s,n])=>{const col=STAT[s][2];h+=`<div class="kcol" style="--col:${col}"><h5>${n}<em>${cnt(s)}</em></h5>`;
  ord.filter(o=>o.st===s).forEach(o=>{const isNew=L.fresh&&L.fresh.has(o.id);const late=Date.now()-o.t.novo>15*60000&&(s==='novo'||s==='preparando');
   const pb=o.pay==='Dinheiro'?`<span class="pb cash">💵 Receber ${R(total(o))}</span>`:`<span class="pb ok">✓ ${o.pay} pago</span>`;
   h+=`<div class="ko ${isNew?'new':''}"><div class="h"><b>#${o.id}</b><span class="${late?'late':''}" data-since="${o.t.novo}">${mmss(Date.now()-o.t.novo)}</span></div><div class="c">${esc(o.cust)} · ${R(total(o))}</div>${pb}<ul>${o.items.map(([id,q])=>`<li><b>${q}×</b> ${esc(byId(id).name)}</li>`).join('')}</ul>${o.notes?`<div class="nt">📝 ${esc(o.notes)}</div>`:''}
   ${s==='rota'?`<div class="tg2">🛵 ${esc(o.courier||'Carlos')} · <span data-pg="${o.id}">${Math.round(prog(o)*100)}</span>% do trajeto</div>`:''}
   <div class="ac">${s==='novo'?`<button data-a="k" data-o="${o.id}" data-s="preparando">▶ Preparar</button>`:s==='preparando'?`<button data-a="k" data-o="${o.id}" data-s="pronto">✓ Pronto</button>`:s==='pronto'?`<button data-a="k" data-o="${o.id}" data-s="rota">🛵 Saiu p/ entrega</button>`:''}<button class="g" data-a="kchat" data-o="${o.id}">💬${o.chat.filter(m=>m.f==='c').length||''}</button></div>
   ${open.includes(String(o.id))?chatBox(o):''}</div>`});
  if(!cnt(s))h+='<div class="mini" style="text-align:center;padding:14px 0">vazio</div>';h+='</div>'});
 h+='</div>';el.innerHTML=h;if(fo&&$('kin')){$('kin').value=val||'';$('kin').focus()}}
const chatBox=o=>`<div class="cx" data-o="${o.id}"><div class="chat">${o.chat.map(m=>`<div class="bb ${m.f==='l'?'me':'lj'}">${esc(m.t)}</div>`).join('')||'<div class="mini">Sem mensagens.</div>'}</div><div class="row"><input class="in" id="kin" data-enter="ksend${o.id}" placeholder="Responder ao cliente"><button class="btn" id="ksend${o.id}" data-a="ksend" data-o="${o.id}">➤</button></div></div>`;
/* ---------- MOTOBOY ---------- */
function motoboy(){const el=$('motoboy');const mine=S.orders.find(o=>o.courier==='Carlos'&&(o.st==='pronto'||o.st==='rota')&&o.accepted);const avail=S.orders.filter(o=>o.st==='pronto'&&!o.courier);const done=S.orders.filter(o=>o.st==='entregue'&&o.courier==='Carlos');
 let h=`<div class="sb" style="color:#fff"><span>9:41</span><span>5G ▮</span></div><div class="sc"><div class="mh"><div><b>Carlos · Moto</b><small>Entregador parceiro · ★ 4,9</small></div><span class="gps ${S.gps?'on':'off'}">${S.gps?'GPS ao vivo':'GPS desligado'}</span></div><div class="ms"><div><small>Corridas hoje</small><b>${done.length+7}</b></div><div><small>Ganhos hoje</small><b>${R((done.length+7)*CFG.store.pay)}</b></div></div>`;
 if(!S.gps){h+=`<div class="perm"><i>📡</i><h3>Ative a localização</h3><p>Para receber corridas e mostrar ao cliente onde você está.</p><ul><li>Só compartilhamos sua posição durante uma corrida ativa</li><li>O cliente vê você no mapa e recebe o aviso “chegando”</li><li>A localização é apagada ao final da entrega</li></ul><button class="btn w" data-a="gps">Permitir localização</button></div></div>`;el.innerHTML=h;return}
 if(mine){const o=mine,p=prog(o),near=p>=.78;
  h+=`<div class="mq">Corrida atual</div><div class="mj"><div class="h"><b>#${o.id} · ${esc(o.cust)}</b><span>${R(CFG.store.pay)}</span></div><p>📍 ${esc(o.addr)}</p>
  ${o.st==='rota'?'<div class="shr">📡 Compartilhando sua localização com o cliente</div>':''}
  <div class="stp2"><div class="on"><i>1</i>Aceita · ir até a loja</div><div class="${o.st==='rota'?'on':''}"><i>2</i>Pedido retirado</div><div class="${near?'on':''}"><i>3</i>Chegando ao endereço</div><div class="${o.arrived?'on':''}"><i>4</i>Confirmar código</div></div>
  ${L.real?realMap(o.addr):mapSVG(o,true)}<div class="mt2"><button data-a="real">${L.real?'Mapa simples':'🗺 Google Maps'}</button><a href="${gmaps(o)}" target="_blank" rel="noopener">▶ Iniciar rota ↗</a></div>
  <ul class="it2">${o.items.map(([id,q])=>`<li>${q}× ${esc(byId(id).name)}</li>`).join('')}</ul>${o.pay==='Dinheiro'?`<div class="shr" style="margin-top:10px;background:#ffb02022;border-color:#ffb02055;color:#ffd27a">💵 Receber ${R(total(o))} do cliente</div>`:''}
  ${o.st==='pronto'?`<button class="btn w" style="margin-top:12px" data-a="mpick" data-o="${o.id}">Retirei o pedido</button>`:!o.arrived?(p<1?`<div class="empty" style="padding:12px"><b>🛵</b>Em rota… <span data-pg="${o.id}">${Math.round(p*100)}</span>%</div>`:`<button class="btn w" style="margin-top:12px" data-a="march" data-o="${o.id}">📍 Cheguei ao endereço</button>`):`<input class="in" id="mcode" data-enter="mdone" placeholder="Código do cliente (4 dígitos)" inputmode="numeric" maxlength="4" style="margin-top:12px;text-align:center;letter-spacing:.3em">${L.cerr?'<div class="msg er">Código incorreto</div>':''}<button class="btn w" id="mdone" style="margin-top:8px" data-a="mdone" data-o="${o.id}">Confirmar entrega</button><div class="mini" style="text-align:center;margin-top:6px;color:#8e92a8">Demo: o código é ${o.code}</div>`}</div>`;
 }else{h+=`<div class="mq">Corridas disponíveis (${avail.length})</div>`;
  h+=avail.map(o=>`<div class="mj"><div class="h"><b>#${o.id} · ${esc(CFG.store.name)}</b><span>${R(CFG.store.pay)}</span></div><p>📍 ${esc(o.addr)} · ~${(1.2+o.id%5*.7).toFixed(1)} km</p><button class="btn w" data-a="maccept" data-o="${o.id}">Aceitar corrida</button></div>`).join('')||'<div class="empty"><b>⏳</b>Nenhuma corrida agora.<br>Quando a cozinha marcar “Pronto”, aparece aqui.</div>'}
 h+='</div>';el.innerHTML=h;moveCouriers()}
/* ---------- ações ---------- */
function renderAll(){const ids=new Set(S.orders.filter(o=>o.st!=='pgto').map(o=>o.id));if(L.seen){const nw=[...ids].filter(i=>!L.seen.has(i));if(nw.length){L.fresh=new Set(nw);if(L.sound)beep()}}else L.fresh=null;L.seen=ids;
 const o=find(L.my);if(o){const sig=o.st+(o.near?'n':'')+(o.arrived?'a':'');const prev=L.lastSt[o.id];if(prev&&prev!==sig&&L.screen==='track'){const msg=o.arrived?['Informe o código de entrega','📍 Entregador chegou']:o.near&&prev.indexOf('n')<0&&o.st==='rota'?['Seu entregador está chegando','🔔 Chegando!']:o.st==='novo'&&prev==='pgto'?['Pagamento confirmado','✅ Pix aprovado']:[STAT[o.st][0],STAT[o.st][1]+' Pedido #'+o.id];setTimeout(()=>toast(msg[0],msg[1]),60)}L.lastSt[o.id]=sig}
 if(L.screen==='track'||!document.activeElement||document.activeElement.tagName!=='INPUT')cliente();cozinha();motoboy()}
function beep(){try{const c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.setValueAtTime(.2,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.5);o.start();o.stop(c.currentTime+.5)}catch(e){}}
function fake(){const n=1+Math.floor(Math.random()*3),its=[];for(let i=0;i<n;i++){its.push([ALL[Math.floor(Math.random()*ALL.length)].id,1+Math.floor(Math.random()*2)])}const pay=['Pix','Cartão','Dinheiro'][Math.floor(Math.random()*3)];const o=mk(S.seq++,'novo',0,NAMES[Math.floor(Math.random()*NAMES.length)],its,ADDR[Math.floor(Math.random()*ADDR.length)],Math.random()<.3?'Capricha no molho':'',pay);o.t.novo=Date.now();S.orders.push(o);save();L.fresh=null;renderAll()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,d=b.dataset;
 if(a==='cat'){L.cat=d.c;cliente()}else if(a==='add'){L.cart[d.id]=(L.cart[d.id]||0)+1;cliente()}else if(a==='cart'){L.screen='cart';cliente()}else if(a==='menu'){L.screen='menu';cliente()}
 else if(a==='inc'){L.cart[d.id]++;cliente()}else if(a==='dec'){L.cart[d.id]=Math.max(0,L.cart[d.id]-1);cliente()}
 else if(a==='coupon'){const v=($('cup').value||'').trim().toUpperCase();if(v==='BEMVINDO10'){L.coupon=v;L.cmsg='✓ 10% de desconto aplicado'}else if(v==='FRETEGRATIS'){L.coupon=v;L.cmsg='✓ Entrega grátis aplicada'}else{L.coupon=null;L.cmsg='Cupom inválido. Tente BEMVINDO10 ou FRETEGRATIS'}L.addr=$('adr').value;L.compl=$('cpl').value;cliente()}
 else if(a==='pay'){L.addr=$('adr').value;L.compl=$('cpl').value;L.pay=d.m;cliente()}else if(a==='real'){const x=$('adr');if(x)L.addr=x.value;L.real=!L.real;renderAll()}
 else if(a==='geo'){L.addr='Av. Paulista, 1578 - Bela Vista';$('adr').value=L.addr;L.compl=$('cpl').value;cliente();toast('Endereço preenchido com a sua localização','📍 Localização')}
 else if(a==='order'){L.addr=$('adr').value||L.addr;L.compl=$('cpl').value;const it=cartItems();if(!it.length)return;const o={id:S.seq++,cust:'Você',items:it,addr:L.addr+(L.compl?' - '+L.compl:''),pay:L.pay,paid:L.pay!=='Dinheiro',notes:'',st:'novo',t:{novo:Date.now()},chat:[],code:String(1000+Math.floor(Math.random()*9000)),fee:cartFee(),disc:cartDisc()};if(L.pay==='Pix'){o.st='pgto';o.paid=false;o.t={pgto:Date.now(),novo:Date.now()}}S.orders.push(o);save();L.my=o.id;localStorage.setItem(KEY+'-my',o.id);L.cart={};L.coupon=null;L.cmsg='';L.screen='track';L.rated=0;renderAll()}
 else if(a==='paynow'){payOk(find(L.my))}else if(a==='copy'){b.textContent='Copiado ✓'}
 else if(a==='call'){toast('Número protegido: a ligação passa pela loja','📞 Ligando…')}else if(a==='chatfocus'){const x=$('cmsg');if(x){x.scrollIntoView({block:'center'});x.focus()}}else if(a==='share'){toast('Link de acompanhamento copiado','🔗 Compartilhar')}
 else if(a==='csend'){const v=$('cmsg').value.trim();if(!v)return;const o=find(L.my);o.chat.push({f:'c',t:v});save();renderAll();if(!o.replied){o.replied=1;save();setTimeout(()=>{const x=find(o.id);if(x){x.chat.push({f:'l',t:'Recebemos sua mensagem! Já estamos vendo 😊'});save();renderAll()}},1600)}}
 else if(a==='star'){L.rated=+d.n;cliente()}else if(a==='again'){L.screen='menu';L.my=null;localStorage.removeItem(KEY+'-my');cliente()}
 else if(a==='k'){setSt(find(+d.o),d.s)}else if(a==='ksound'){L.sound=!L.sound;cozinha()}
 else if(a==='kchat'){const x=qa('.cx',$('cozinha')).find(z=>z.dataset.o===d.o);if(x)x.remove();else{b.closest('.ko').insertAdjacentHTML('beforeend',chatBox(find(+d.o)));$('kin').focus()}}
 else if(a==='ksend'){const i=$('kin');const v=i&&i.value.trim();if(!v)return;const o=find(+d.o);o.chat.push({f:'l',t:v});save();renderAll();const k=$('kin');if(k){k.value='';k.focus()}}
 else if(a==='gps'){S.gps=true;save();renderAll()}
 else if(a==='maccept'){const o=find(+d.o);o.courier='Carlos';o.accepted=1;save();renderAll()}
 else if(a==='mpick'){setSt(find(+d.o),'rota')}
 else if(a==='march'){const o=find(+d.o);o.arrived=true;o.t.arrived=Date.now();o.near=true;save();renderAll()}
 else if(a==='mdone'){const o=find(+d.o);if(($('mcode').value||'')===o.code){L.cerr=false;setSt(o,'entregue')}else{L.cerr=true;motoboy()}}
 else if(a==='fake')fake();else if(a==='reset'){S=seed();save();L.my=null;L.screen='menu';L.cart={};L.seen=null;localStorage.removeItem(KEY+'-my');renderAll()}
 else if(a==='tab')setTab(d.t)});
document.addEventListener('keydown',e=>{if(e.key==='Enter'){const i=e.target.closest('[data-enter]');if(i){const b=$(i.dataset.enter);b&&b.click()}}});
function setTab(t){qa('.col').forEach(c=>c.classList.toggle('on',c.id==='col-'+t));qa('#mt button').forEach(b=>b.classList.toggle('on',b.dataset.t===t))}
const v=new URLSearchParams(location.search).get('view');
if(v&&['cliente','cozinha','motoboy'].includes(v)){document.body.classList.add('single');setTab(v)}else setTab('cliente');
const wide=()=>matchMedia('(min-width:1201px)').matches;
if(!v&&wide())qa('.col').forEach(c=>c.classList.add('on'));
addEventListener('resize',()=>{if(v)return;if(wide())qa('.col').forEach(c=>c.classList.add('on'));else setTab((qa('.col.on')[0]||{id:'col-cliente'}).id.slice(4))});
if(L.my&&find(L.my))L.screen='track';
renderAll();
setInterval(()=>{const now=Date.now();qa('[data-since]').forEach(s=>{const ms=now-(+s.dataset.since);s.textContent=mmss(ms);s.classList.toggle('late',ms>15*60000)});qa('[data-ex]').forEach(s=>{s.textContent=mmss(600000-(now-(+s.dataset.ex)))});moveCouriers();
 qa('[data-pg]').forEach(x=>{const o=find(+x.dataset.pg);if(o)x.textContent=Math.round(prog(o)*100)});
 S.orders.forEach(o=>{if(o.st==='pgto'&&now-o.t.pgto>PIX_MS+4000)payOk(o)});
 let ch=false;S.orders.forEach(o=>{if(o.st==='rota'&&!o.near&&prog(o)>=.78){o.near=true;o.t.near=now;ch=true}});if(ch){save();renderAll()}
 const m=S.orders.find(o=>o.st==='rota'&&o.courier==='Carlos'&&o.accepted);const sig=m?m.id+':'+(prog(m)>=1)+':'+(!!m.arrived)+':'+(!!m.near):'';if(sig!==L.msig){L.msig=sig;if(!(document.activeElement&&document.activeElement.id==='mcode'))motoboy()}
 const me=find(L.my);if(me&&me.st==='rota'&&L.screen==='track'&&!(document.activeElement&&document.activeElement.tagName==='INPUT')){const k=Math.round(prog(me)*10);if(k!==L.lastP){L.lastP=k;cliente()}}},1000);
LH.switcher($('langsw'));LH.observe(document.body);
LH.meta({title:{pt:'Açaí Tropical — Delivery próprio',en:'Açaí Tropical — Your own delivery',es:'Açaí Tropical — Delivery propio'}});
LH.start();
</script></body></html>
