# Confere o app da Lhart de 5 em 5 minutos e deixa o site avisar no Telegram/WhatsApp se algo cair.
# Precisa do segredo OPS_KEY (GitHub: Settings > Secrets and variables > Actions) igual ao OPS_KEY da Vercel.
name: Monitor Lhart
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}
permissions: {}
jobs:
  checar:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Chamar o monitor
        env:
          OPS_KEY: ${{ secrets.OPS_KEY }}
        run: |
          test -n "$OPS_KEY" || { echo "Falta o segredo OPS_KEY"; exit 1; }
          curl -fsS -m 60 --retry 2 --retry-delay 5 -H "x-ops-key: $OPS_KEY" "https://www.lhartdesign.com/api/ops?a=monitor" | tee resposta.json
          echo
